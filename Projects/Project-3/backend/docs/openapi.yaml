openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    example: ok
                  info:
                    type: object
                    example: &ref_0
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *ref_0
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                      - shutting_down
                    example: error
                  info:
                    type: object
                    example:
                      database: &ref_1
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &ref_2
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *ref_1
                      redis: *ref_2
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      tags:
        - health
      summary: Liveness and readiness check
      description: >-
        Confirms the process is running and that Postgres is reachable. Excluded
        from the (not-yet-registered) global auth guard and from Observe's event
        budget — a platform healthcheck should never need credentials or count
        against a telemetry quota.
  /auth/register-company:
    post:
      operationId: AuthController_registerCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCompanyResponseDto'
      tags: &ref_3
        - auth
      summary: Register a company
      description: >-
        Creates the company (`pending_activation`), its first admin (`invited`)
        and their password identity in one transaction, then emails an
        activation link valid for 24 hours. The admin cannot sign in until the
        link is used. The form has no name field, so `fullName` starts as the
        local part of the email; change it with `PATCH /users/me`. A password
        sign-in email identifies exactly one account, so an address already
        registered returns 409.
  /auth/activate:
    get:
      operationId: AuthController_activate
      parameters:
        - name: token
          required: true
          in: query
          description: The single-use token from the emailed link.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_3
      summary: Activate a company
      description: >-
        Spends the single-use token from the activation email and turns the
        company and its admin `active`. An expired, unknown or already-used
        token returns 400 — request a fresh one with `POST
        /auth/resend-activation`.
  /auth/resend-activation:
    post:
      operationId: AuthController_resendActivation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_3
      summary: Resend the activation email
      description: >-
        Issues a fresh activation link and invalidates the previous one. Always
        answers 200 with the same message, whether or not the address is
        registered, so it cannot be used to discover accounts.
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_3
      summary: Sign in with email and password
      description: >-
        Returns a 15-minute access token and a 30-day, single-use refresh token.
        Refused with 403 while the company or the user is not yet active, and
        with 401 for a wrong email or password (the two are indistinguishable).
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_3
      summary: Exchange a refresh token for a new session
      description: >-
        Rotates the refresh token: the one presented is spent and a new pair is
        returned. Presenting an already-spent token means it was copied, so
        every session descended from that login is revoked and both holders must
        sign in again.
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_3
      summary: Sign out
      description: >-
        Revokes the session the refresh token belongs to. Public, because the
        access token has usually expired by the time someone signs out. Always
        answers 200.
  /auth/password/forgot:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_3
      summary: Request a password reset email
      description: >-
        Emails a reset link valid for one hour to an active account. Always
        answers 200 with the same message, whether or not the address is
        registered.
  /auth/password/reset:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_3
      summary: Reset a forgotten password
      description: >-
        Sets a new password using the emailed token and signs the account out of
        every device. The token is single-use.
  /auth/accept-invite:
    post:
      operationId: AuthController_acceptInvite
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_3
      summary: Accept an invitation
      description: >-
        Spends the single-use token from an invitation email, sets the
        employee's password, activates them and signs them in — returning the
        same session as login. The link itself proves who they are, so nothing
        compares email addresses. Billing for their seat starts now, not when
        they were invited. An unknown, expired, used or superseded link returns
        400.
  /auth/password:
    patch:
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      security:
        - bearer: []
      tags: *ref_3
      summary: Change your password
      description: >-
        Requires the current password. Signs out every session, including this
        one, and returns a fresh session so the calling device stays signed in.
        A confirmation email is sent.
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - bearer: []
      tags: *ref_3
      summary: Get the signed-in user and their company
      description: >-
        The caller's own user record and company. Role and status come from the
        database on every request, not from the token, so a change of role or a
        disabled account is reflected immediately.
  /users/me:
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
      security:
        - bearer: []
      tags:
        - users
      summary: Update your own profile
      description: >-
        Changes the signed-in person's own `fullName` — the personal-data half
        of "change password and personal data". Available to admins and
        employees.
  /companies/me/members:
    get:
      operationId: CompaniesController_members
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberDto'
      security: &ref_4
        - bearer: []
      tags: &ref_5
        - companies
      summary: List members (names only)
      description: >-
        Any signed-in user. Returns `{ id, fullName }` for each active person in
        the company and nothing else — no email, role or status — so an employee
        can name grantees for a restricted file without being able to list or
        profile colleagues. People who are invited-but-not-yet-joined or removed
        are left out.
  /companies/me:
    patch:
      operationId: CompaniesController_updateMine
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDto'
      security: *ref_4
      tags: *ref_5
      summary: Update your company profile
      description: >-
        Admin only; employees receive 403. Changes only the fields named:
        `name`, `country`, `industry`, `billingEmail`. The company is always the
        caller's own, taken from the session — there is no way to name another
        tenant. A `billingEmail` already used by another company returns 409.
  /subscriptions/plans:
    get:
      operationId: SubscriptionsController_plans
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDto'
      tags: &ref_6
        - subscriptions
      summary: List the plans
      description: >-
        The public plan catalog — limits and prices for Free, Basic and Premium.
        No account needed, so a pricing page can render it. Prices are integer
        cents. Seats are the admin plus employees, so Basic's 10 employees is 11
        seats.
  /subscriptions/me:
    get:
      operationId: SubscriptionsController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_6
      summary: Get the company's subscription
      description: >-
        The current plan, its limits, usage so far this period (files,
        employees, seats), the period window and when it is next due. Available
        to admins and employees. Returns 404 until an admin has chosen a plan.
    post:
      operationId: SubscriptionsController_choose
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_6
      summary: Choose the first plan
      description: >-
        The mandatory step after activation: features that need a plan answer
        402 until one is chosen. Admin only. Billing is anchored to today's day
        of the month; the first period starts at UTC midnight today. Returns 409
        if a plan already exists — use `PATCH /subscriptions/me` to change it.
    patch:
      operationId: SubscriptionsController_change
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeResultDto'
      security:
        - bearer: []
      tags: *ref_6
      summary: Change plan
      description: >-
        Upgrade or downgrade. A change is a new activation: the outgoing period
        is closed and invoiced for the days it ran (the switch day belongs to
        the new plan), and a fresh period opens today, re-anchoring billing to
        today's day of the month. `prorationCents` is the total of that closing
        invoice. Rejected with 409, naming the numbers, if the company is over
        the target plan's employee cap or (for Free and Basic) has already
        uploaded more files this period than it allows. Admin only.
  /employees:
    post:
      operationId: EmployeesController_invite
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteEmployeeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: &ref_7
        - bearer: []
      tags: &ref_8
        - employees
      summary: Invite an employee
      description: >-
        Creates an `invited` employee and emails them a link valid for 7 days.
        An invitation holds a seat immediately but bills nothing until they
        accept, so the seat cap counts `invited` and `active` people together:
        Free allows none, Basic 10, Premium is unlimited. Over the cap returns
        409 with the numbers. The address must not already belong to a Gridline
        account (409).
    get:
      operationId: EmployeesController_list
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - invited
              - active
              - disabled
        - name: role
          required: false
          in: query
          schema:
            type: string
            enum:
              - admin
              - employee
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePageDto'
      security: *ref_7
      tags: *ref_8
      summary: List the company's people
      description: >-
        Full records, offset-paginated, oldest first. Filter with `status`
        (`invited`, `active`, `disabled`) and `role`. Removed employees are
        included so they can be reactivated. Employees cannot call this — they
        get the names-only `GET /companies/me/members` instead.
  /employees/{id}/resend-invite:
    post:
      operationId: EmployeesController_resendInvite
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: *ref_7
      tags: *ref_8
      summary: Resend an invitation
      description: >-
        Issues a fresh link and kills the previous one. Only for someone still
        `invited`; anyone else returns 409.
  /employees/{id}:
    delete:
      operationId: EmployeesController_disable
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: *ref_7
      tags: *ref_8
      summary: Remove an employee
      description: >-
        A soft-disable, not a delete. The employee is signed out everywhere,
        their login is removed, any pending link is spent, their seat is freed
        and billing for it stops today. The files they uploaded stay with the
        company. You cannot remove yourself or an admin. Removing someone twice
        returns 409.
  /employees/{id}/reactivate:
    post:
      operationId: EmployeesController_reactivate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: *ref_7
      tags: *ref_8
      summary: Bring a removed employee back
      description: >-
        Their login was deleted on removal, so this sends a fresh invitation:
        they become `invited`, hold a seat again (the plan's cap is re-checked,
        409 if full) and set a password when they accept. Only for a removed
        employee.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_9
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AcceptInviteDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the invitation email.
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum: &ref_11
            - admin
            - employee
        status:
          type: string
          enum: &ref_12
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_9
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - fullName
    MemberDto:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
      required:
        - id
        - fullName
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_9
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_10
            - free
            - basic
            - premium
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_10
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_10
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_10
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
    InviteEmployeeDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
          description: Where the invitation is sent. Also the address they sign in with.
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - email
        - fullName
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invitations go to.
        fullName:
          type: string
        role:
          type: string
          enum: *ref_11
        status:
          type: string
          enum: *ref_12
        activatedAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
        - disabledAt
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    EmployeePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
