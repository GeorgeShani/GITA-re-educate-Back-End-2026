openapi: 3.0.0
paths:
  /files:
    post:
      operationId: FilesController_upload
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            A UUID. A retry with the same key and the same file replays the
            first response instead of uploading twice.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileBodyDoc'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: &ref_0
        - bearer: []
      tags: &ref_1
        - files
      summary: Upload a spreadsheet
      description: >-
        Multipart upload of a CSV, XLS or XLSX file up to 25 MB, with a
        `visibility` of `company` (the default) or `restricted` and, for a
        restricted file, `grantedUserIds` (repeat the field or send a JSON
        array; they must be active members of the company — get their ids from
        `GET /companies/me/members`). The type is decided from the file's
        **bytes**, never from its name or `Content-Type`: an executable renamed
        `report.csv` is refused with 400, as is a Word document renamed `.xls`.
        A refused, invalid or failed upload stores nothing and consumes no
        quota.


        **Quota.** Free (10 files per billing period) and Basic (100) answer
        **402** once the period's quota is used, naming the plan, the count, the
        cap and the date the quota resets — the upload never starts. Premium
        (1000 included) always accepts; a file past the 1000th carries an
        `X-Gridline-Quota-Warning` header and a $0.50 overage charge. Deleting a
        file does not refund its quota.


        **Idempotency.** Send an `Idempotency-Key` (a UUID) and a retry with the
        same key and the same file replays the first response — marked
        `Idempotent-Replayed: true`, warning header included — instead of
        uploading and counting twice. The same key with a different request is
        422; while the first request is still running, 409. A request that
        failed is not remembered.


        Each upload queues a data-quality report and is recorded in the audit
        log. Returns 413 above 25 MB.
    get:
      operationId: FilesController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque; take it from `meta.nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: sort
          required: false
          in: query
          description: A leading `-` is descending.
          schema:
            default: -createdAt
            type: string
            enum:
              - -createdAt
              - createdAt
        - name: mimeType
          required: false
          in: query
          schema:
            type: string
            enum:
              - text/csv
              - application/vnd.ms-excel
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - name: visibility
          required: false
          in: query
          schema:
            type: string
            enum:
              - company
              - restricted
        - name: uploaderId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: uploadedAfter
          required: false
          in: query
          description: Uploaded at or after this instant.
          schema:
            format: date-time
            type: string
        - name: uploadedBefore
          required: false
          in: query
          description: Uploaded before this instant.
          schema:
            format: date-time
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePageDto'
      security: *ref_0
      tags: *ref_1
      summary: List files
      description: >-
        The files the caller may see: everything company-wide, plus restricted
        files they uploaded or were granted, and every file for an admin.
        Cursor-paginated, newest first (`sort=createdAt` reverses it); follow
        `meta.nextCursor` until `hasMore` is false. Filters (`mimeType`,
        `visibility`, `uploaderId`, `uploadedAfter`, `uploadedBefore`) only ever
        narrow that set. Rows never include where the bytes are stored or who a
        restricted file is shared with.
  /files/{id}:
    get:
      operationId: FilesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: *ref_0
      tags: *ref_1
      summary: Get a file
      description: >-
        A file the caller cannot see is **404**, never 403, so its existence is
        not disclosed. The uploader and admins also get `grantedUserIds`, the
        colleagues a restricted file is shared with.
    patch:
      operationId: FilesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: *ref_0
      tags: *ref_1
      summary: Change who can see a file
      description: >-
        Uploader or admin only. `visibility` switches between `company` and
        `restricted`; `grantedUserIds` REPLACES the set of colleagues granted
        access (only for a restricted file — switching to `company` clears it).
        A colleague who can see the file but did not upload it gets 403; someone
        who cannot see it gets 404. The change takes effect on the next request
        and is audited.
    delete:
      operationId: FilesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      security: *ref_0
      tags: *ref_1
      summary: Delete a file
      description: >-
        Uploader or admin only. A soft delete: the file disappears from every
        listing and its stored object is removed, but the row and its history
        are kept and the upload still counts toward this period's quota.
  /files/{id}/download:
    get:
      operationId: FilesController_download
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadDto'
      security: *ref_0
      tags: *ref_1
      summary: Get a download link
      description: >-
        Checks the caller's access, then returns a signed link that expires in
        five minutes (`expiresAt`). The link needs no Authorization header; the
        browser saves it under the file's original name. With S3 storage it is a
        presigned S3 URL; with the development `local` driver it points at this
        API.
  /files/{id}/report:
    get:
      operationId: FilesController_report
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
      security: *ref_0
      tags: *ref_1
      summary: Get a file's data-quality report
      description: >-
        Every upload queues a report, so this is never a 404 for a file you can
        see. `status` moves `queued` → `profiling` → `ready`. When `ready`,
        `metrics` holds the row and column counts and, per column: the share of
        empty cells, the inferred type (`integer`, `number`, `boolean`, `date`,
        `string`), whether the column mixes kinds of value and by how much, and
        numeric min / max / mean; plus duplicate and empty rows, ragged rows and
        header problems. Only the first 100,000 rows are profiled;
        `metrics.truncated` says when the file was longer.


        `narrative` is a plain-language summary and recommendations written by
        an AI model from those statistics alone — it is never shown a row or a
        cell value. It is `null` when no AI provider is configured, or it timed
        out or answered unusably; the metrics are unaffected either way.


        `unsupported` means the file is stored but not profiled (legacy `.xls`:
        save it as `.xlsx` or `.csv`). `failed` means it could not be read
        (corrupt, malformed, or too large to open safely) — `errorMessage` says
        why; a report can also show `failed` briefly while a temporary problem
        is retried automatically. Visible exactly when the file is: a file you
        cannot see is a 404.
  /files/{id}/preview:
    get:
      operationId: FilesController_preview
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewDto'
      security: *ref_0
      tags: *ref_1
      summary: Preview a file's first rows
      description: >-
        The first 50 rows of the file and the inferred type of each column, for
        rendering a table without downloading anything. Served from what
        profiling stored, so it costs no file read. Dates are ISO strings and
        long cells are cut to 200 characters. Returns 409 while the report is
        still being prepared, and 422 with the reason when no preview can be
        made (`unsupported` or `failed`). Visible exactly when the file is.
  /billing/current:
    get:
      operationId: BillingController_current
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementDto'
      security: &ref_2
        - bearer: []
      tags: &ref_3
        - billing
      summary: The running bill for this period
      description: >-
        What this period's invoice will be if nothing changes, with the
        line-item breakdown, the seat count and the due date. Admin only. It is
        computed on demand by the same calculator that finalizes invoices, so
        the two cannot disagree.


        - **Free** has no line items.

        - **Basic** has one line per employee stretch: $5 × (active days ÷ days
        in the period), rounded half-up to the cent. An employee who joined
        mid-period pays for the days since; a removed employee stops that day;
        an invited employee who has not accepted yet costs nothing. Employees
        active now are assumed to stay active to the end of the period.

        - **Premium** is $300 plus $0.50 for every file past the 1000 included.


        All amounts are integer cents. If the daily job has not yet rolled a
        finished period over, the period we are actually in is priced — reading
        never changes anything. A suspended company can still read this.
  /billing/invoices:
    get:
      operationId: BillingController_invoices
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePageDto'
      security: *ref_2
      tags: *ref_3
      summary: List invoices
      description: >-
        Finalized invoices, newest period first, offset-paginated (`page`,
        `limit`). Admin only; a suspended company can still read them. There is
        one invoice per billing period, plus one for the part-period closed when
        the plan changed.
  /billing/invoices/{id}:
    get:
      operationId: BillingController_invoice
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
      security: *ref_2
      tags: *ref_3
      summary: Get one invoice
      description: >-
        An invoice with its line items. Invoices are immutable: what this
        returns is what was issued, even if the plan has changed since. Another
        company's invoice is a 404. Admin only.
  /notifications:
    get:
      operationId: NotificationsController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque; take it from `meta.nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: unread
          required: false
          in: query
          description: Only notifications you have not read yet.
          schema:
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPageDto'
      security: &ref_4
        - bearer: []
      tags: &ref_5
        - notifications
      summary: List your notifications
      description: >-
        Your own inbox, newest first, cursor-paginated (`limit`, and `cursor`
        from `meta.nextCursor` until `hasMore` is false). `unread=true` narrows
        it to what you have not read. Nobody sees anyone else's inbox, admins
        included.


        What lands here, and who it goes to:

        - `quota.threshold` — every admin, once per billing period each time the
        company passes 80% and 100% of its file quota. The payload says the
        plan, the count and the plan that would raise the limit. (The billing
        address gets the same news by email.)

        - `report.ready` / `report.failed` — the person who uploaded the file,
        when its data-quality report finishes or fails for good. A failure that
        will be retried says nothing until the retry settles.

        - `file.shared` — a person a file was shared with (on upload, or when an
        uploader or admin adds them). Not the person who did the sharing.

        - `invoice.finalized` — every admin, when an invoice with something to
        pay is issued.


        New entries also arrive live on the realtime connection as
        `notification.created`, and only once the change that caused them has
        committed. Read notifications are removed after 90 days; unread ones
        stay. Signed-in sessions only: an API key cannot read the inbox.
  /notifications/unread-count:
    get:
      operationId: NotificationsController_unreadCount
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountDto'
      security: *ref_4
      tags: *ref_5
      summary: Count your unread notifications
      description: >-
        How many of your notifications you have not read yet — the number for a
        badge. Cheap enough to call on every page load.
  /notifications/read-all:
    post:
      operationId: NotificationsController_readAll
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkedReadDto'
      security: *ref_4
      tags: *ref_5
      summary: Mark all your notifications as read
      description: >-
        Marks every unread notification of yours as read and says how many that
        was. Calling it again changes nothing (`updated: 0`).
  /notifications/{id}/read:
    post:
      operationId: NotificationsController_read
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDto'
      security: *ref_4
      tags: *ref_5
      summary: Mark one notification as read
      description: >-
        Marks one of your notifications as read and returns it. Idempotent:
        reading one that is already read changes nothing and keeps its first
        `readAt`. A notification that is not yours — or does not exist — is a
        404.
  /subscriptions/plans:
    get:
      operationId: SubscriptionsController_plans
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDto'
      tags: &ref_6
        - subscriptions
      summary: List the plans
      description: >-
        The public plan catalog — limits and prices for Free, Basic and Premium.
        No account needed, so a pricing page can render it. Prices are integer
        cents. Seats are the admin plus employees, so Basic's 10 employees is 11
        seats.
  /subscriptions/me:
    get:
      operationId: SubscriptionsController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_6
      summary: Get the company's subscription
      description: >-
        The current plan, its limits, usage so far this period (files,
        employees, seats), the period window and when it is next due. Available
        to admins and employees. Returns 404 until an admin has chosen a plan.
    post:
      operationId: SubscriptionsController_choose
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_6
      summary: Choose the first plan
      description: >-
        The mandatory step after activation: features that need a plan answer
        402 until one is chosen. Admin only. Billing is anchored to today's day
        of the month; the first period starts at UTC midnight today. Returns 409
        if a plan already exists — use `PATCH /subscriptions/me` to change it.
    patch:
      operationId: SubscriptionsController_change
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            A UUID. A retry with the same key and body replays the first
            response instead of changing the plan (and billing the proration)
            twice.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeResultDto'
      security:
        - bearer: []
      tags: *ref_6
      summary: Change plan
      description: >-
        Upgrade or downgrade. A change is a new activation: the outgoing period
        is closed and invoiced for the days it ran (the switch day belongs to
        the new plan), and a fresh period opens today, re-anchoring billing to
        today's day of the month. `prorationCents` is the total of that closing
        invoice. Rejected with 409, naming the numbers, if the company is over
        the target plan's employee cap or (for Free and Basic) has already
        uploaded more files this period than it allows. Admin only.


        Send an `Idempotency-Key` (a UUID) so a retried request is not applied —
        or prorated and billed — twice: the same key with the same body replays
        the first response (`Idempotent-Replayed: true`); the same key with a
        different body is 422.


        **Rate limits.** Every plan has a request budget shared by the whole
        company (its users and its API keys together): 30 requests per minute on
        Free, 120 on Basic, 600 on Premium (`rateLimitPerMinute` in the plan
        catalog). The current budget is on every response in
        `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset`
        (seconds), and an over-limit request gets 429 with `Retry-After`, naming
        the plan and the way up. A plan change applies from the very next
        request, and this route (and choosing a first plan) keeps a small budget
        of its own, so a company that has used up its requests can still
        upgrade.
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                    example: ok
                  info:
                    type: object
                    example: &ref_7
                      database:
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example: *ref_7
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - error
                      - shutting_down
                    example: error
                  info:
                    type: object
                    example:
                      database: &ref_8
                        status: up
                        responseTime: 12
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis: &ref_9
                        status: down
                        message: Could not connect
                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *ref_8
                      redis: *ref_9
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      tags:
        - health
      summary: Liveness and readiness check
      description: >-
        Confirms the process is running and that Postgres is reachable. Excluded
        from the (not-yet-registered) global auth guard and from Observe's event
        budget — a platform healthcheck should never need credentials or count
        against a telemetry quota.
  /auth/register-company:
    post:
      operationId: AuthController_registerCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCompanyResponseDto'
      tags: &ref_10
        - auth
      summary: Register a company
      description: >-
        Creates the company (`pending_activation`), its first admin (`invited`)
        and their password identity in one transaction, then emails an
        activation link valid for 24 hours. The admin cannot sign in until the
        link is used. The form has no name field, so `fullName` starts as the
        local part of the email; change it with `PATCH /users/me`. A password
        sign-in email identifies exactly one account, so an address already
        registered returns 409.
  /auth/activate:
    get:
      operationId: AuthController_activate
      parameters:
        - name: token
          required: true
          in: query
          description: The single-use token from the emailed link.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_10
      summary: Activate a company
      description: >-
        Spends the single-use token from the activation email and turns the
        company and its admin `active`. An expired, unknown or already-used
        token returns 400 — request a fresh one with `POST
        /auth/resend-activation`.
  /auth/resend-activation:
    post:
      operationId: AuthController_resendActivation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_10
      summary: Resend the activation email
      description: >-
        Issues a fresh activation link and invalidates the previous one. Always
        answers 200 with the same message, whether or not the address is
        registered, so it cannot be used to discover accounts.
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_10
      summary: Sign in with email and password
      description: >-
        Returns a 15-minute access token and a 30-day, single-use refresh token.
        Refused with 403 while the company or the user is not yet active, and
        with 401 for a wrong email or password (the two are indistinguishable).
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_10
      summary: Exchange a refresh token for a new session
      description: >-
        Rotates the refresh token: the one presented is spent and a new pair is
        returned. Presenting an already-spent token means it was copied, so
        every session descended from that login is revoked and both holders must
        sign in again.
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_10
      summary: Sign out
      description: >-
        Revokes the session the refresh token belongs to. Public, because the
        access token has usually expired by the time someone signs out. Always
        answers 200.
  /auth/password/forgot:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_10
      summary: Request a password reset email
      description: >-
        Emails a reset link valid for one hour to an active account. Always
        answers 200 with the same message, whether or not the address is
        registered.
  /auth/password/reset:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_10
      summary: Reset a forgotten password
      description: >-
        Sets a new password using the emailed token and signs the account out of
        every device. The token is single-use.
  /auth/accept-invite:
    post:
      operationId: AuthController_acceptInvite
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_10
      summary: Accept an invitation
      description: >-
        Spends the single-use token from an invitation email, sets the
        employee's password, activates them and signs them in — returning the
        same session as login. The link itself proves who they are, so nothing
        compares email addresses. Billing for their seat starts now, not when
        they were invited. An unknown, expired, used or superseded link returns
        400.
  /auth/password:
    patch:
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      security:
        - bearer: []
      tags: *ref_10
      summary: Change your password
      description: >-
        Requires the current password. Signs out every session, including this
        one, and returns a fresh session so the calling device stays signed in.
        A confirmation email is sent.
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - bearer: []
      tags: *ref_10
      summary: Get the signed-in user and their company
      description: >-
        The caller's own user record and company. Role and status come from the
        database on every request, not from the token, so a change of role or a
        disabled account is reflected immediately.
  /auth/oauth/google/url:
    post:
      operationId: OAuthController_googleUrl
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleUrlDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlDto'
      tags: &ref_11
        - auth
      summary: Start signing in, registering or accepting an invite with Google
      description: >-
        Returns the Google authorization URL to send the browser to, and sets an
        httpOnly `gl_oauth_nonce` cookie that pins the flow to this browser —
        the callback refuses to continue without it, which is what stops a
        victim being signed into an attacker's account. Call it from the
        browser, or forward the `Set-Cookie` if a server makes the call. `login`
        and `register` behave identically: a Google account already known signs
        in, an unknown one is offered company registration. `invite` needs the
        `inviteToken` from the invitation email and binds the Google account to
        the invited user, with no email comparison. A dead invite is refused
        here with 400, before any trip to Google. Answers 503 when Google
        sign-in is not configured; password auth is unaffected.
  /auth/google/callback:
    get:
      operationId: OAuthController_googleCallback
      parameters:
        - name: error
          required: false
          in: query
          schema: {}
        - name: state
          required: false
          in: query
          schema: {}
        - name: code
          required: false
          in: query
          schema: {}
      responses:
        '302':
          description: Redirects the browser to the web app.
      tags: *ref_11
      summary: Google redirects the browser back here
      description: >-
        Not called by API clients: Google navigates the browser to it, and it
        always answers with a redirect to the web app — never JSON, because a
        person is looking at the page. Success redirects to
        `/session/oauth-complete?code=…`, where `code` is a single-use,
        60-second value to trade at `POST /auth/oauth/exchange`; no token ever
        appears in a URL. An unknown Google account redirects to
        `/register?oauthRegistration=…`. A linking flow redirects to
        `/settings/linked-accounts?linked=google`. Any refusal redirects with
        `?error=` set to one of `invalid_state`, `access_denied`,
        `provider_error`, `invalid_invite`, `identity_in_use`, `already_linked`,
        `not_activated`, `account_unavailable` or `ambiguous_email`. A known
        `(google, sub)` signs in whatever email Google now reports. An unknown
        one is linked to an existing user only when Google verified the address,
        it is not a relay/alias address, and it exactly matches one active
        user's contact address.
  /auth/oauth/exchange:
    post:
      operationId: OAuthController_exchange
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_11
      summary: Trade the callback's code for a session
      description: >-
        Called by the web app's server after the redirect to
        `/session/oauth-complete`. The code is single-use and expires after 60
        seconds; the account is re-checked at this moment, so someone disabled
        in the meantime gets 401. Returns the same session as login.
  /auth/oauth/registration/preview:
    post:
      operationId: OAuthController_registrationPreview
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRegistrationTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRegistrationPreviewDto'
      tags: *ref_11
      summary: Read what a Google registration token prefills
      description: >-
        Decodes the `oauthRegistration` token from the redirect to `/register`
        into what the form should prefill. `email` is null when Google reported
        a relay or alias address — the person must supply a real one.
        `emailVerified` says whether Google vouches for it, which decides
        whether registration skips the activation email.
  /auth/oauth/register-company:
    post:
      operationId: OAuthController_registerCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRegisterCompanyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRegisterCompanyResponseDto'
      tags: *ref_11
      summary: Register a company with a Google account
      description: >-
        The same form as `POST /auth/register-company` minus the password
        (Google is the credential), plus the `oauthRegistration` token. When
        Google vouches for the address it becomes the contact address, the
        company is active at once, no activation email is sent, and the response
        carries a session. Otherwise `email` is required and the flow is a
        password registration's: an activation email is sent and no session is
        returned. The token is valid for 15 minutes. Returns 409 when the
        company address or the Google account is already registered.
  /auth/identities/google/link:
    post:
      operationId: OAuthController_linkGoogle
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlDto'
      security:
        - bearer: []
      tags: *ref_11
      summary: Start linking a Google account to the signed-in user
      description: >-
        "Settings → Linked accounts." Returns the Google URL and sets the same
        flow cookie as `POST /auth/oauth/google/url`. When the callback returns,
        the Google account is bound to the signed-in user with no email
        comparison at all — a relay address, a personal Gmail and an unrelated
        one all work. A Google account that already belongs to someone else, or
        a user who already has a different one, is refused with `?error=`.
  /auth/identities:
    get:
      operationId: OAuthController_listIdentities
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityListDto'
      security:
        - bearer: []
      tags: *ref_11
      summary: List your sign-in methods
      description: >-
        The caller's own identities — password and/or Google — with the address
        each provider reports, which may differ from the work address forever.
        Never returns a hash or the provider's subject.
  /auth/identities/{id}:
    delete:
      operationId: OAuthController_unlinkIdentity
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      security:
        - bearer: []
      tags: *ref_11
      summary: Remove a sign-in method
      description: >-
        Removes one of the caller's own identities. Returns 409 when it is the
        only one left — a user with no way to sign in cannot be helped by anyone
        but a DBA. Someone else's identity is a 404.
  /users/me:
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
      security:
        - bearer: []
      tags:
        - users
      summary: Update your own profile
      description: >-
        Changes the signed-in person's own `fullName` — the personal-data half
        of "change password and personal data". Available to admins and
        employees.
  /companies/me/members:
    get:
      operationId: CompaniesController_members
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberDto'
      security: &ref_12
        - bearer: []
      tags: &ref_13
        - companies
      summary: List members (names only)
      description: >-
        Any signed-in user. Returns `{ id, fullName }` for each active person in
        the company and nothing else — no email, role or status — so an employee
        can name grantees for a restricted file without being able to list or
        profile colleagues. People who are invited-but-not-yet-joined or removed
        are left out.
  /companies/me:
    patch:
      operationId: CompaniesController_updateMine
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDto'
      security: *ref_12
      tags: *ref_13
      summary: Update your company profile
      description: >-
        Admin only; employees receive 403. Changes only the fields named:
        `name`, `country`, `industry`, `billingEmail`. The company is always the
        caller's own, taken from the session — there is no way to name another
        tenant. A `billingEmail` already used by another company returns 409.
  /employees:
    post:
      operationId: EmployeesController_invite
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteEmployeeDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: &ref_14
        - bearer: []
      tags: &ref_15
        - employees
      summary: Invite an employee
      description: >-
        Creates an `invited` employee and emails them a link valid for 7 days.
        An invitation holds a seat immediately but bills nothing until they
        accept, so the seat cap counts `invited` and `active` people together:
        Free allows none, Basic 10, Premium is unlimited. Over the cap returns
        409 with the numbers. The address must not already belong to a Gridline
        account (409).
    get:
      operationId: EmployeesController_list
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - invited
              - active
              - disabled
        - name: role
          required: false
          in: query
          schema:
            type: string
            enum:
              - admin
              - employee
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePageDto'
      security: *ref_14
      tags: *ref_15
      summary: List the company's people
      description: >-
        Full records, offset-paginated, oldest first. Filter with `status`
        (`invited`, `active`, `disabled`) and `role`. Removed employees are
        included so they can be reactivated. Employees cannot call this — they
        get the names-only `GET /companies/me/members` instead.
  /employees/{id}/resend-invite:
    post:
      operationId: EmployeesController_resendInvite
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: *ref_14
      tags: *ref_15
      summary: Resend an invitation
      description: >-
        Issues a fresh link and kills the previous one. Only for someone still
        `invited`; anyone else returns 409.
  /employees/{id}:
    delete:
      operationId: EmployeesController_disable
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: *ref_14
      tags: *ref_15
      summary: Remove an employee
      description: >-
        A soft-disable, not a delete. The employee is signed out everywhere,
        their login is removed, any pending link is spent, their seat is freed
        and billing for it stops today. The files they uploaded stay with the
        company. You cannot remove yourself or an admin. Removing someone twice
        returns 409.
  /employees/{id}/reactivate:
    post:
      operationId: EmployeesController_reactivate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeDto'
      security: *ref_14
      tags: *ref_15
      summary: Bring a removed employee back
      description: >-
        Their login was deleted on removal, so this sends a fresh invitation:
        they become `invited`, hold a seat again (the plan's cap is re-checked,
        409 if full) and set a password when they accept. Only for a removed
        employee.
  /analytics/usage:
    get:
      operationId: AnalyticsController_usage
      parameters:
        - name: from
          required: false
          in: query
          description: >-
            First day, inclusive. Default: the first day of the current billing
            period.
          schema:
            format: date
            example: '2026-03-01'
            type: string
        - name: to
          required: false
          in: query
          description: >-
            Last day, exclusive. Default: through today. At most 366 days after
            `from`.
          schema:
            format: date
            example: '2026-04-01'
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageAnalyticsDto'
      security:
        - bearer: []
      tags:
        - analytics
      summary: Usage analytics
      description: >-
        Admin only. One request returns everything a usage dashboard draws.


        `from` and `to` are read as UTC days (any time of day is dropped) and
        `to` is exclusive; with neither the range is the current billing period
        so far, and it can be at most 366 days. Within the range:


        - `filesPerDay`: uploads per day, with a zero for every quiet day so a
        chart has a point for each.

        - `byEmployee`: each uploader's files, bytes and last upload, most
        active first — including people since removed, whose history stays.

        - `storage`: live files and bytes right now (deleted files excluded,
        whatever the range), and the bytes uploaded in the range (deleted files
        included).


        Always for the CURRENT billing period, regardless of the range:


        - `quota`: cumulative uploads per day against the plan's included quota,
        with the even-pace line to compare it to. It counts exactly what the
        running bill counts.


        And the whole `planHistory`, newest change first: each change joined to
        the invoice that closed the outgoing period.


        A deleted file still counts as an upload: deleting does not undo that it
        happened.
  /audit:
    get:
      operationId: AuditLogController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque; take it from `meta.nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: action
          required: false
          in: query
          schema:
            type: string
            enum:
              - company.registered
              - company.activated
              - company.activation_resent
              - company.updated
              - user.profile_updated
              - auth.password_reset_requested
              - auth.password_reset
              - auth.password_changed
              - auth.identity_linked
              - auth.identity_unlinked
              - employee.invited
              - employee.invite_resent
              - employee.accepted_invite
              - employee.disabled
              - employee.reactivated
              - subscription.created
              - subscription.changed
              - billing.invoice_finalized
              - api_key.created
              - api_key.revoked
              - file.uploaded
              - file.access_changed
              - file.deleted
        - name: actorUserId
          required: false
          in: query
          description: Only what this person did.
          schema:
            format: uuid
            type: string
        - name: targetType
          required: false
          in: query
          description: The kind of thing acted on.
          schema:
            example: file
            type: string
        - name: from
          required: false
          in: query
          description: At or after this instant.
          schema:
            format: date-time
            type: string
        - name: to
          required: false
          in: query
          description: Before this instant.
          schema:
            format: date-time
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageDto'
      security: &ref_16
        - bearer: []
      tags: &ref_17
        - audit
      summary: List audit entries
      description: >-
        The company's audit log, newest first, cursor-paginated (`limit`, and
        `cursor` from `meta.nextCursor` until `hasMore` is false). Admin only.
        Every state-changing action in the app writes an entry in the same
        transaction as the change: who did it (`actorUserId`, null for the
        system — the billing cycle — or someone since removed), what (`action`,
        from a closed list), what it acted on (`targetType` / `targetId`), from
        where (`ip`), and a `correlationId` that ties together everything one
        request wrote and matches that request's logs.


        Filters narrow the result: `action`, `actorUserId`, `targetType`, and
        `from` (inclusive) / `to` (exclusive) timestamps. The list omits each
        entry's `metadata`; read a single entry for that. The log is append-only
        — nothing can edit or delete an entry, and the database itself refuses
        to.
  /audit/{id}:
    get:
      operationId: AuditLogController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEntryDetailDto'
      security: *ref_16
      tags: *ref_17
      summary: Get one audit entry
      description: >-
        One entry with its `metadata`: the details specific to the action, such
        as the plan changed to, or a file's name and type. Another company's
        entry is a 404. Admin only.
  /api-keys:
    post:
      operationId: ApiKeysController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiKeyDto'
      security: &ref_18
        - bearer: []
      tags: &ref_19
        - api-keys
      summary: Create an API key
      description: >-
        Mints a personal API key so a script or integration can use Gridline
        without a browser session. **The full key is in this response and only
        this one — it is stored as a hash and can never be shown again**, so
        copy it now. Send it like a session token: `Authorization: Bearer
        gl_live_…`.


        A key acts **as you**, with your permissions at the moment of each
        request, narrowed to the `scopes` you choose:

        - `files:read` — list and read files, their reports and previews,
        download links, and `GET /subscriptions/me`.

        - `files:write` — upload, change who can see a file, and delete a file.

        - `billing:read` — the billing statements and invoices. Admin only: an
        employee cannot grant it (403), and if you stop being an admin your keys
        lose it.


        A key can never do anything else: it cannot sign in or change
        credentials, manage employees or plans, read the audit log or analytics,
        or create, list or revoke API keys — those need a signed-in session.
        Disable a person and their keys stop working immediately.


        Each person can hold up to 25 active keys (409 beyond that); revoke one
        to make room. Give the key a `name` so you can tell your keys apart
        later.
    get:
      operationId: ApiKeysController_list
      parameters:
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyPageDto'
      security: *ref_18
      tags: *ref_19
      summary: List API keys
      description: >-
        Newest first, paginated (`page`, `limit`). An admin sees every key in
        the company; an employee sees only their own. The secret is never
        returned: you get the `prefix` (the first part of the key, not a secret)
        to recognise it by, its `scopes`, whose it is, when it was `lastUsedAt`
        (approximate — refreshed at most every five minutes) and whether it has
        been revoked.
  /api-keys/{id}:
    delete:
      operationId: ApiKeysController_revoke
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyDto'
      security: *ref_18
      tags: *ref_19
      summary: Revoke an API key
      description: >-
        Stops the key working immediately; it cannot be restored — create a new
        one. An admin can revoke any key in the company, an employee only their
        own (someone else's key is a 404, as if it did not exist). Revoking a
        key that is already revoked succeeds and changes nothing. Removing an
        employee revokes all of their keys.
  /auth/demo:
    post:
      operationId: DemoController_login
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags:
        - auth
      summary: Explore the read-only demo
      description: >-
        Signs in as the admin of the seeded demo company — no email or password
        — so anyone can look around a populated account: a Basic plan, four
        people, six files (one restricted) with data-quality reports, a
        finalized invoice and an audit trail. Returns the same session as `POST
        /auth/login`.


        The demo is strictly **look, don't touch**: every request that would
        change anything (any method other than GET) is refused with 403 and an
        explanation, so visitors cannot alter it or each other's view of it.
        Answers 404 if the demo has not been seeded on this server (`npm run
        seed:demo`). Limited to 20 requests per minute per address.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadFileBodyDoc:
      type: object
      properties:
        visibility:
          type: string
          enum: &ref_20
            - company
            - restricted
          default: company
        grantedUserIds:
          description: >-
            With `restricted`: the colleagues who may also see the file (the
            uploader and admins always can). Repeat the field, or send a JSON
            array. Empty means the uploader and admins only.
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileDto:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
          description: From the file's bytes, not from what the client claimed.
        sizeBytes:
          type: number
        visibility:
          type: string
          enum: *ref_20
        uploaderId:
          type: string
        grantedUserIds:
          nullable: true
          description: >-
            Who a restricted file is shared with. Shown only to the uploader and
            admins, and only on single-file responses; null everywhere else.
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - originalName
        - mimeType
        - sizeBytes
        - visibility
        - uploaderId
        - grantedUserIds
        - createdAt
    CursorMetaDto:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.
        hasMore:
          type: boolean
      required:
        - nextCursor
        - hasMore
    FilePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    FileDownloadDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            A short-lived link. Fetch it directly; it needs no Authorization
            header.
        expiresAt:
          type: string
          format: date-time
          description: The link stops working at this instant.
      required:
        - url
        - expiresAt
    TypeCountsDto:
      type: object
      properties:
        integer:
          type: number
        number:
          type: number
        boolean:
          type: number
        date:
          type: number
        string:
          type: number
      required:
        - integer
        - number
        - boolean
        - date
        - string
    NumericStatsDto:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        mean:
          type: number
      required:
        - min
        - max
        - mean
    ColumnMetricsDto:
      type: object
      properties:
        index:
          type: number
        name:
          type: string
        nullCount:
          type: number
          description: Blank and whitespace-only cells count as empty.
        nullPercent:
          type: number
          description: Percent of the column that is empty, 0–100, two decimals.
        inferredType:
          type: string
          enum: &ref_21
            - integer
            - number
            - boolean
            - date
            - string
            - empty
          description: The dominant kind of value in the column.
        typeCounts:
          $ref: '#/components/schemas/TypeCountsDto'
        inconsistent:
          type: boolean
          description: More than one kind of value in the column (numbers AND text, say).
        inconsistentPercent:
          type: number
          description: Percent of non-empty cells that disagree with the dominant type.
        numeric:
          nullable: true
          description: Over the numeric cells; null if there are none.
          type: object
          allOf:
            - $ref: '#/components/schemas/NumericStatsDto'
      required:
        - index
        - name
        - nullCount
        - nullPercent
        - inferredType
        - typeCounts
        - inconsistent
        - inconsistentPercent
        - numeric
    MetricsDto:
      type: object
      properties:
        rowCount:
          type: number
          description: Data rows profiled, header excluded.
        columnCount:
          type: number
        emptyRows:
          type: number
          description: Rows with no value in any column.
        duplicateRows:
          type: number
          description: Rows identical to an earlier row.
        raggedRows:
          type: number
          description: Rows with more or fewer cells than the header.
        truncated:
          type: boolean
          description: >-
            True when the file had more rows than the profile budget: the
            numbers cover the first `rowBudget` rows.
        rowBudget:
          type: number
        headerIssues:
          description: Problems with the header row (blank or repeated names).
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMetricsDto'
      required:
        - rowCount
        - columnCount
        - emptyRows
        - duplicateRows
        - raggedRows
        - truncated
        - rowBudget
        - headerIssues
        - columns
    NarrativeDto:
      type: object
      properties:
        summary:
          type: string
        recommendations:
          type: array
          items:
            type: string
        model:
          type: string
          description: The model that wrote it.
      required:
        - summary
        - recommendations
        - model
    ReportDto:
      type: object
      properties:
        fileId:
          type: string
        status:
          type: string
          enum:
            - queued
            - profiling
            - ready
            - unsupported
            - failed
        metrics:
          nullable: true
          description: Present once `status` is `ready`.
          type: object
          allOf:
            - $ref: '#/components/schemas/MetricsDto'
        narrative:
          nullable: true
          description: >-
            The plain-language summary. Null when no AI provider is configured
            or it produced nothing usable; the metrics are unaffected.
          type: object
          allOf:
            - $ref: '#/components/schemas/NarrativeDto'
        errorMessage:
          type: string
          nullable: true
          description: Why the report is `failed` or `unsupported`.
        profiledAt:
          type: string
          format: date-time
          nullable: true
      required:
        - fileId
        - status
        - metrics
        - narrative
        - errorMessage
        - profiledAt
    PreviewColumnDto:
      type: object
      properties:
        name:
          type: string
        inferredType:
          type: string
          enum: *ref_21
      required:
        - name
        - inferredType
    PreviewDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/PreviewColumnDto'
        rows:
          type: array
          items:
            type: array
            items:
              nullable: true
              oneOf:
                - type: string
                - type: number
                - type: boolean
          description: >-
            The first rows, one array of cells per row in column order. Dates
            are ISO strings.
        totalRows:
          type: number
          description: Rows in the file (up to the profile budget).
        truncated:
          type: boolean
          description: True when `rows` is only the first part of the file.
      required:
        - columns
        - rows
        - totalRows
        - truncated
    UpdateFileDto:
      type: object
      properties:
        visibility:
          type: string
          enum: *ref_20
        grantedUserIds:
          description: >-
            REPLACES the set of colleagues granted access. Only meaningful for a
            `restricted` file; switching to `company` clears it.
          type: array
          items:
            type: string
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    BillingPeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: 'Exclusive, UTC midnight: when the next period starts.'
        days:
          type: number
      required:
        - start
        - end
        - days
    LineItemDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - seat
            - plan_base
            - overage
        description:
          type: string
          example: Employee seat
        unitCents:
          type: number
          description: The full price this line is a fraction of, in cents.
        amountCents:
          type: number
          description: What this line costs, in integer cents.
        userId:
          type: string
          description: 'seat: the employee this seat is for.'
        activeDays:
          type: number
          description: 'seat: days the employee was active in the period.'
        billedDays:
          type: number
          description: 'plan_base: days the plan was billed.'
        periodDays:
          type: number
          description: 'seat / plan_base: days in the whole period.'
        files:
          type: number
          description: 'overage: files beyond the plan’s included quota.'
      required:
        - kind
        - description
        - unitCents
        - amountCents
    StatementDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_22
            - free
            - basic
            - premium
        period:
          $ref: '#/components/schemas/BillingPeriodDto'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: >-
            What the invoice will be if nothing changes: employees active now
            are assumed to stay active to the end of the period, and files count
            as uploaded so far. Integer cents.
        seats:
          type: number
          description: 'Seats in use right now: the admin plus every active employee.'
        filesThisPeriod:
          type: number
          description: Files uploaded so far this period.
        dueDate:
          type: string
          format: date-time
          description: When the period ends and the invoice is finalized.
        asOf:
          type: string
          format: date-time
          description: When this statement was computed.
      required:
        - plan
        - period
        - lineItems
        - totalCents
        - seats
        - filesThisPeriod
        - dueDate
        - asOf
    InvoiceDto:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
          enum: *ref_22
          description: The plan that was live during the billed period.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
          description: >-
            Exclusive. Earlier than the period end when a plan change closed the
            period early.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: Integer cents.
        status:
          type: string
          enum:
            - finalized
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - plan
        - periodStart
        - periodEnd
        - lineItems
        - totalCents
        - status
        - dueDate
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    InvoicePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    NotificationDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - quota.threshold
            - report.ready
            - report.failed
            - file.shared
            - invoice.finalized
          description: What happened. Decides the shape of `payload`.
        payload:
          type: object
          additionalProperties: true
          description: >-
            Ids, counts and names for this `type` — never cell values. For
            `quota.threshold`: `threshold`, `plan`, `filesUsed`, `filesLimit`,
            `upgradeTo`. For `report.ready`/`report.failed`: `fileId`,
            `fileName`. For `file.shared`: `fileId`, `fileName`,
            `sharedByUserId`. For `invoice.finalized`: `invoiceId`,
            `totalCents`.
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Null while unread.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - payload
        - readAt
        - createdAt
    NotificationPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    UnreadCountDto:
      type: object
      properties:
        count:
          type: number
          description: How many of your notifications are unread.
      required:
        - count
    MarkedReadDto:
      type: object
      properties:
        updated:
          type: number
          description: How many notifications this call marked as read.
      required:
        - updated
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_22
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
        rateLimitPerMinute:
          type: number
          description: >-
            Requests per minute the whole company may make, shared by its users
            and API keys.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
        - rateLimitPerMinute
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_22
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_22
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_22
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_23
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AcceptInviteDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the invitation email.
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum: &ref_24
            - admin
            - employee
        status:
          type: string
          enum: &ref_25
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_23
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
        isDemo:
          type: boolean
          description: >-
            True for the seeded read-only demo company, where every write is
            refused. A client can use it to show a demo banner.
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
        - isDemo
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    GoogleUrlDto:
      type: object
      properties:
        intent:
          type: string
          enum:
            - login
            - register
            - invite
          description: >-
            `login` and `register` behave identically (a known Google account
            signs in, an unknown one is offered company registration); the value
            is for the frontend. `invite` binds the Google account to the
            invited user.
        inviteToken:
          type: string
          description: 'Required for `invite`: the token from the invitation email.'
      required:
        - intent
    OAuthUrlDto:
      type: object
      properties:
        url:
          type: string
          description: Send the browser here. Google sends it back to the API callback.
      required:
        - url
    OAuthExchangeDto:
      type: object
      properties:
        code:
          type: string
          description: >-
            The single-use `code` from the redirect to
            `/session/oauth-complete`. Valid for 60 seconds.
      required:
        - code
    OAuthRegistrationTokenDto:
      type: object
      properties:
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
      required:
        - oauthRegistrationToken
    OAuthRegistrationPreviewDto:
      type: object
      properties:
        email:
          type: string
          nullable: true
          description: >-
            The address to prefill, or null when Google reported a relay/alias
            address (ask the person for one).
        emailVerified:
          type: boolean
          description: >-
            True when Google vouches for `email`; registration then needs no
            activation email.
        name:
          type: string
          nullable: true
      required:
        - email
        - emailVerified
        - name
    OAuthRegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_23
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - companyName
        - country
        - industry
        - oauthRegistrationToken
    OAuthRegisterCompanyResponseDto:
