          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_23
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
    InviteEmployeeDto:
      type: object
      properties:
        email:
