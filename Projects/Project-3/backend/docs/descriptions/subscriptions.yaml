# Prose for the `subscriptions` tag, keyed by operationId.

SubscriptionsController_plans:
  summary: List the plans
  description: >-
    The public plan catalog — limits and prices for Free, Basic and Premium.
    No account needed, so a pricing page can render it. Prices are integer cents.
    Seats are the admin plus employees, so Basic's 10 employees is 11 seats.

SubscriptionsController_me:
  summary: Get the company's subscription
  description: >-
    The current plan, its limits, usage so far this period (files, employees,
    seats), the period window and when it is next due. Available to admins and
    employees. Returns 404 until an admin has chosen a plan.

SubscriptionsController_choose:
  summary: Choose the first plan
  description: >-
    The mandatory step after activation: features that need a plan answer 402
    until one is chosen. Admin only. Billing is anchored to today's day of the
    month; the first period starts at UTC midnight today. Free activates immediately.
    Basic and Premium return 202 with a hosted Stripe Checkout URL and remain inactive
    until a verified Stripe webhook provisions them. Returns 409 if a plan already exists —
    use `PATCH /subscriptions/me` to change it.

SubscriptionsController_change:
  summary: Change plan
  description: >-
    Upgrade or downgrade. With Stripe configured, the request returns 202 while the
    current local plan remains authoritative; Stripe applies immediate proration and resets
    the billing cycle, and only a verified webhook changes Gridline's local plan. The local
    development fallback keeps the deterministic calculator path. Rejected
    with 409, naming the numbers, if the company is over the target plan's
    employee cap or (for Free and Basic) has already uploaded more files this
    period than it allows, or while a dataset exceeds the target's version cap. Admin only.


    Send an `Idempotency-Key` (a UUID) so a retried request is not applied — or
    prorated and billed — twice: the same key with the same body replays the first
    response (`Idempotent-Replayed: true`); the same key with a different body is 422.


    **Rate limits.** Every plan has a request budget shared by the whole company (its users
    and its API keys together): 30 requests per minute on Free, 120 on Basic, 600 on Premium
    (`rateLimitPerMinute` in the plan catalog). The current budget is on every response
    in `X-RateLimit-Limit`, `X-RateLimit-Remaining` and `X-RateLimit-Reset` (seconds), and an
    over-limit request gets 429 with `Retry-After`, naming the plan and the way up. A plan
    change applies from the very next request, and this route (and choosing a first plan) keeps
    a small budget of its own, so a company that has used up its requests can still upgrade.
