# Prose for the `employees` tag, keyed by operationId. Every route here is
# admin-only (employees get 403) and needs a chosen plan (402 otherwise).

EmployeesController_invite:
  summary: Invite an employee
  description: >-
    Creates an `invited` employee and emails them a link valid for 7 days. An
    invitation holds a seat immediately but bills nothing until they accept, so
    the seat cap counts `invited` and `active` people together: Free allows none,
    Basic 10, Premium is unlimited. Over the cap returns 409 with the numbers.
    The address must not already belong to a Gridline account (409).

EmployeesController_list:
  summary: List the company's people
  description: >-
    Full records, offset-paginated, oldest first. Filter with `status`
    (`invited`, `active`, `disabled`) and `role`. Removed employees are included
    so they can be reactivated. Employees cannot call this — they get the
    names-only `GET /companies/me/members` instead.

EmployeesController_resendInvite:
  summary: Resend an invitation
  description: >-
    Issues a fresh link and kills the previous one. Only for someone still
    `invited`; anyone else returns 409.

EmployeesController_disable:
  summary: Remove an employee
  description: >-
    A soft-disable, not a delete. The employee is signed out everywhere, their
    login is removed, any pending link is spent, their seat is freed and billing
    for it stops today. The files they uploaded stay with the company. You cannot
    remove yourself or an admin. Removing someone twice returns 409.

EmployeesController_reactivate:
  summary: Bring a removed employee back
  description: >-
    Their login was deleted on removal, so this sends a fresh invitation: they
    become `invited`, hold a seat again (the plan's cap is re-checked, 409 if
    full) and set a password when they accept. Only for a removed employee.
