# Prose for the `auth` tag, keyed by operationId. Hand-written — the only file
# in docs/ a human edits directly. `npm run docs:generate` merges it and fails,
# naming the operationId, if a route exists with no matching entry here.

AuthController_registerCompany:
  summary: Register a company
  description: >-
    Creates the company (`pending_activation`), its first admin (`invited`) and
    their password identity in one transaction, then emails an activation link
    valid for 24 hours. The admin cannot sign in until the link is used. The
    form has no name field, so `fullName` starts as the local part of the email;
    change it with `PATCH /users/me`. A password sign-in email identifies exactly
    one account, so an address already registered returns 409.

AuthController_activate:
  summary: Activate a company
  description: >-
    Spends the single-use token from the activation email and turns the company
    and its admin `active`. An expired, unknown or already-used token returns
    400 — request a fresh one with `POST /auth/resend-activation`.

AuthController_resendActivation:
  summary: Resend the activation email
  description: >-
    Issues a fresh activation link and invalidates the previous one. Always
    answers 200 with the same message, whether or not the address is registered,
    so it cannot be used to discover accounts.

AuthController_login:
  summary: Sign in with email and password
  description: >-
    Returns a 15-minute access token and a 30-day, single-use refresh token.
    Refused with 403 while the company or the user is not yet active, and with
    401 for a wrong email or password (the two are indistinguishable).

AuthController_refresh:
  summary: Exchange a refresh token for a new session
  description: >-
    Rotates the refresh token: the one presented is spent and a new pair is
    returned. Presenting an already-spent token means it was copied, so every
    session descended from that login is revoked and both holders must sign in
    again.

AuthController_logout:
  summary: Sign out
  description: >-
    Revokes the session the refresh token belongs to. Public, because the access
    token has usually expired by the time someone signs out. Always answers 200.

AuthController_forgotPassword:
  summary: Request a password reset email
  description: >-
    Emails a reset link valid for one hour to an active account. Always answers
    200 with the same message, whether or not the address is registered.

AuthController_resetPassword:
  summary: Reset a forgotten password
  description: >-
    Sets a new password using the emailed token and signs the account out of
    every device. The token is single-use.

AuthController_changePassword:
  summary: Change your password
  description: >-
    Requires the current password. Signs out every session, including this one,
    and returns a fresh session so the calling device stays signed in. A
    confirmation email is sent.

AuthController_me:
  summary: Get the signed-in user and their company
  description: >-
    The caller's own user record and company. Role and status come from the
    database on every request, not from the token, so a change of role or a
    disabled account is reflected immediately.

AuthController_acceptInvite:
  summary: Accept an invitation
  description: >-
    Spends the single-use token from an invitation email, sets the employee's
    password, activates them and signs them in — returning the same session as
    login. The link itself proves who they are, so nothing compares email
    addresses. Billing for their seat starts now, not when they were invited.
    An unknown, expired, used or superseded link returns 400.

OAuthController_googleUrl:
  summary: Start signing in, registering or accepting an invite with Google
  description: >-
    Returns the Google authorization URL to send the browser to, and sets an
    httpOnly `gl_oauth_nonce` cookie that pins the flow to this browser — the
    callback refuses to continue without it, which is what stops a victim being
    signed into an attacker's account. Call it from the browser, or forward the
    `Set-Cookie` if a server makes the call. `login` and `register` behave
    identically: a Google account already known signs in, an unknown one is
    offered company registration. `invite` needs the `inviteToken` from the
    invitation email and binds the Google account to the invited user, with no
    email comparison. A dead invite is refused here with 400, before any trip to
    Google. Answers 503 when Google sign-in is not configured; password auth is
    unaffected.

OAuthController_googleCallback:
  summary: Google redirects the browser back here
  description: >-
    Not called by API clients: Google navigates the browser to it, and it always
    answers with a redirect to the web app — never JSON, because a person is
    looking at the page. Success redirects to `/session/oauth-complete?code=…`,
    where `code` is a single-use, 60-second value to trade at
    `POST /auth/oauth/exchange`; no token ever appears in a URL. An unknown
    Google account redirects to `/register?oauthRegistration=…`. A linking flow
    redirects to `/settings/linked-accounts?linked=google`. Any refusal redirects
    with `?error=` set to one of `invalid_state`, `access_denied`,
    `provider_error`, `invalid_invite`, `identity_in_use`, `already_linked`,
    `not_activated`, `account_unavailable` or `ambiguous_email`. A known
    `(google, sub)` signs in whatever email Google now reports. An unknown one is
    linked to an existing user only when Google verified the address, it is not a
    relay/alias address, and it exactly matches one active user's contact address.

OAuthController_exchange:
  summary: Trade the callback's code for a session
  description: >-
    Called by the web app's server after the redirect to `/session/oauth-complete`.
    The code is single-use and expires after 60 seconds; the account is re-checked
    at this moment, so someone disabled in the meantime gets 401. Returns the same
    session as login.

OAuthController_registrationPreview:
  summary: Read what a Google registration token prefills
  description: >-
    Decodes the `oauthRegistration` token from the redirect to `/register` into
    what the form should prefill. `email` is null when Google reported a relay or
    alias address — the person must supply a real one. `emailVerified` says
    whether Google vouches for it, which decides whether registration skips the
    activation email.

OAuthController_registerCompany:
  summary: Register a company with a Google account
  description: >-
    The same form as `POST /auth/register-company` minus the password (Google is
    the credential), plus the `oauthRegistration` token. When Google vouches for
    the address it becomes the contact address, the company is active at once, no
    activation email is sent, and the response carries a session. Otherwise `email`
    is required and the flow is a password registration's: an activation email is
    sent and no session is returned. The token is valid for 15 minutes. Returns 409
    when the company address or the Google account is already registered.

OAuthController_linkGoogle:
  summary: Start linking a Google account to the signed-in user
  description: >-
    "Settings → Linked accounts." Returns the Google URL and sets the same flow
    cookie as `POST /auth/oauth/google/url`. When the callback returns, the Google
    account is bound to the signed-in user with no email comparison at all — a
    relay address, a personal Gmail and an unrelated one all work. A Google account
    that already belongs to someone else, or a user who already has a different one,
    is refused with `?error=`.

OAuthController_listIdentities:
  summary: List your sign-in methods
  description: >-
    The caller's own identities — password and/or Google — with the address each
    provider reports, which may differ from the work address forever. Never
    returns a hash or the provider's subject.

OAuthController_unlinkIdentity:
  summary: Remove a sign-in method
  description: >-
    Removes one of the caller's own identities. Returns 409 when it is the only one
    left — a user with no way to sign in cannot be helped by anyone but a DBA. Someone
    else's identity is a 404.

DemoController_login:
  summary: Explore the read-only demo
  description: >-
    Signs in as the admin of the seeded demo company — no email or password — so anyone
    can look around a populated account: a Basic plan, four people, six files (one
    restricted) with data-quality reports, a finalized invoice and an audit trail. Returns
    the same session as `POST /auth/login`.


    The demo is strictly **look, don't touch**: every request that would change anything
    (any method other than GET) is refused with 403 and an explanation, so visitors cannot
    alter it or each other's view of it. Answers 404 if the demo has not been seeded on this
    server (`npm run seed:demo`). Limited to 20 requests per minute per address.
