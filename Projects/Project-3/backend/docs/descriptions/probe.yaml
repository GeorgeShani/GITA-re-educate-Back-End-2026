# Prose for the `probe` tag. ProbeController is temporary scaffolding
# (removed once Milestone 3 lands real modules) but is fully documented
# anyway — it's what proves the whole DTO -> OpenAPI -> Scalar ->
# openapi-typescript chain end to end before any real feature depends on it.

ProbeController_echo:
  summary: Echo a number, doubled
  description: >-
    Smoke-test route for the global ValidationPipe and AllExceptionsFilter.
    `n` must be an integer between 1 and 100; anything else returns the
    standard error envelope.

ProbeController_sorted:
  summary: Echo a parsed sort specification
  description: >-
    Smoke-test route for ParseSortPipe. `sort` accepts a comma-separated list
    of `n`/`createdAt`, each optionally prefixed with `-` for descending; any
    other field name returns the standard error envelope naming it.
