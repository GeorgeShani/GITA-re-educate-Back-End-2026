# Prose for the `files` tag, keyed by operationId. Hand-written — see auth.yaml.

FilesController_upload:
  summary: Upload a spreadsheet
  description: >-
    Multipart upload of a CSV, XLS or XLSX file up to 25 MB, with a `visibility` of
    `company` (the default) or `restricted` and, for a restricted file,
    `grantedUserIds` (repeat the field or send a JSON array; they must be active
    members of the company — get their ids from `GET /companies/me/members`). The
    type is decided from the file's **bytes**, never from its name or `Content-Type`:
    an executable renamed `report.csv` is refused with 400, as is a Word document
    renamed `.xls`. A refused, invalid or failed upload stores nothing and consumes no
    quota.


    **Quota.** Free (10 files per billing period) and Basic (100) answer **402** once
    the period's quota is used, naming the plan, the count, the cap and the date the
    quota resets — the upload never starts. Premium (1000 included) always accepts;
    a file past the 1000th carries an `X-Gridline-Quota-Warning` header and a $0.50
    overage charge. Deleting a file does not refund its quota.


    **Idempotency.** Send an `Idempotency-Key` (a UUID) and a retry with the same key
    and the same file replays the first response — marked `Idempotent-Replayed: true`,
    warning header included — instead of uploading and counting twice. The same key
    with a different request is 422; while the first request is still running, 409.
    A request that failed is not remembered.


    Each upload queues a data-quality report and is recorded in the audit log. Returns
    413 above 25 MB.

FilesController_list:
  summary: List files
  description: >-
    The files the caller may see: everything company-wide, plus restricted files they
    uploaded or were granted, and every file for an admin. Cursor-paginated, newest
    first (`sort=createdAt` reverses it); follow `meta.nextCursor` until `hasMore` is
    false. Filters (`mimeType`, `visibility`, `uploaderId`, `uploadedAfter`,
    `uploadedBefore`) only ever narrow that set. Rows never include where the bytes are
    stored or who a restricted file is shared with.


    A file that has several **versions** is listed once, as its newest version (`isLatest`);
    `allVersions=true` lists every version you can see. `datasetId` is shared by all the
    versions of one file.

FilesController_get:
  summary: Get a file
  description: >-
    A file the caller cannot see is **404**, never 403, so its existence is not
    disclosed. The uploader and admins also get `grantedUserIds`, the colleagues a
    restricted file is shared with.

FilesController_download:
  summary: Get a download link
  description: >-
    Checks the caller's access, then returns a signed link that expires in five
    minutes (`expiresAt`). The link needs no Authorization header; the browser saves it
    under the file's original name. With S3 storage it is a presigned S3 URL; with the
    development `local` driver it points at this API.

FilesController_update:
  summary: Change who can see a file
  description: >-
    Uploader or admin only. `visibility` switches between `company` and `restricted`;
    `grantedUserIds` REPLACES the set of colleagues granted access (only for a
    restricted file — switching to `company` clears it). A colleague who can see the
    file but did not upload it gets 403; someone who cannot see it gets 404. The change
    takes effect on the next request and is audited.

FilesController_remove:
  summary: Delete a file
  description: >-
    Uploader or admin only. A soft delete: the file disappears from every listing and
    its stored object is removed, but the row and its history are kept and the upload
    still counts toward this period's quota.

FilesController_report:
  summary: Get a file's data-quality report
  description: >-
    Every upload queues a report, so this is never a 404 for a file you can see. `status`
    moves `queued` → `profiling` → `ready`. When `ready`, `metrics` holds the row and
    column counts and, per column: the share of empty cells, the inferred type
    (`integer`, `number`, `boolean`, `date`, `string`), whether the column mixes kinds of
    value and by how much, and numeric min / max / mean; plus duplicate and empty rows,
    ragged rows and header problems. Only the first 100,000 rows are profiled;
    `metrics.truncated` says when the file was longer.


    `narrative` is a plain-language summary and recommendations written by an AI model
    from those statistics alone — it is never shown a row or a cell value. It is `null`
    when no AI provider is configured, or it timed out or answered unusably; the metrics
    are unaffected either way.


    `unsupported` means the file is stored but not profiled (legacy `.xls`: save it as
    `.xlsx` or `.csv`). `failed` means it could not be read (corrupt, malformed, or too
    large to open safely) — `errorMessage` says why; a report can also show `failed`
    briefly while a temporary problem is retried automatically. Visible exactly when the
    file is: a file you cannot see is a 404.


    **Quality rules.** When the company has data-quality rules (`/quality-rules`), `ruleResults`
    holds one result per enabled rule — `passed`, `failed`, or `skipped` when the rule does not
    apply to this file (its column is not in it, or holds no numbers) — each with the rule as it was
    when the report was built, and `qualityScore` (0–100) is the share of applicable rules passed,
    an `error` rule counting double a `warning`. Both are `null` when the company had no rules, and the
    score is also `null` when none of them applied. Editing or deleting a rule later does not change
    an existing report: rebuild it (`POST /files/{id}/report/rebuild`) to check it against the rules
    as they are now.

FilesController_rebuildReport:
  summary: Rebuild a file's report against today's rules
  description: >-
    Builds the report again from the same stored file, checking it against the company's quality
    rules as they are **now** — how an old file is re-checked after its rules changed. The uploader
    or an admin only (someone who can see the file but did not upload it gets 403; a file you cannot
    see is a 404). The report goes back to `queued` at once and the new result arrives as before
    (`file.status` over the realtime connection, or read the report again). Answers 409 while a
    build is already queued or running, so it cannot be requested twice. Needs the `files:write`
    scope for an API key.

FilesController_preview:
  summary: Preview a file's first rows
  description: >-
    The first 50 rows of the file and the inferred type of each column, for rendering a
    table without downloading anything. Served from what profiling stored, so it costs no
    file read. Dates are ISO strings and long cells are cut to 200 characters. Returns
    409 while the report is still being prepared, and 422 with the reason when no preview
    can be made (`unsupported` or `failed`). Visible exactly when the file is.

FilesController_uploadVersion:
  summary: Upload a new version of a file
  description: >-
    Adds the next version to the file `id` belongs to (any of its versions will do): version 2,
    then 3, and so on. Multipart, with the same `file` part and the same rules as `POST /files` —
    the type is read from the bytes, up to 25 MB, `Idempotency-Key` is honoured — and it is a real
    upload: **it counts toward the period's file quota** and the plan's limit applies (402 past it,
    exactly like a new file), and it gets its own data-quality report.


    The new version becomes the file's **latest**. It inherits who can see the file — the visibility and
    the grants of the previous latest version, plus that version's uploader, so nobody loses the file
    because someone else uploaded the next version — and takes **no fields** of its own (sending one is a
    400). After that each version's access is its own: `PATCH /files/{id}` changes one version only.


    Only the uploader or an admin may add a version: someone who can see the file but did not upload it
    gets 403, and a file you cannot see (or that was deleted) is a 404. Each plan keeps a number of
    versions per file (Free 5, Basic 50, Premium unlimited); beyond it the answer is 409 naming the plan
    and the number, and deleting a version makes room. Version numbers are never reused. Needs the
    `files:write` scope for an API key.


    When the new version drops or retypes a column that the previous one had, the uploader and the admins
    get a `dataset.schema_changed` notification once its report is built.

FilesController_versions:
  summary: List a file's versions
  description: >-
    Every version of the file `id` belongs to that the caller may see, newest first, offset-paginated.
    Works from any of its versions. Versions the caller cannot see are left out, and a file you cannot see
    at all is a 404.

FilesController_compare:
  summary: Compare two versions of a file
  description: >-
    What changed from `id` to `otherId` (normally an older version to a newer one), worked out from
    their stored data-quality reports — nothing is read from the files again. Both must be visible to you
    (a file you cannot see is a 404) and be versions of the same file (422 otherwise), and both reports must
    be `ready` (409 while one is still being built, 422 when one failed or is unsupported).


    The answer lists `columnsAdded` and `columnsRemoved` (names ignore case, so a renamed header is one of
    each), `typeChanges` (a column whose dominant type changed), `nullPercentChanges` (empty cells moved by
    5 percentage points or more), the change in rows, columns, duplicate rows and quality score, and
    `schemaChanged`: true when a column was removed or retyped — the changes that break a reader of the data.
    New columns and shifts in blanks do not set it.

CleaningController_preview:
  summary: Preview what a cleaning recipe would change
  description: >-
    Counts what each step of the recipe would do across the **whole** file and returns the first
    rows that change, each cell before and after. Nothing is written. Steps run in order; a step
    about a column the file does not have is skipped, not refused. A file over 100,000 rows or 200
    columns, or a legacy `.xls`, answers 422. The uploader or an admin only; a file you cannot see
    is a 404. Needs the `files:write` scope for an API key.

CleaningController_clean:
  summary: Clean a file as its next version
  description: >-
    Queues the recipe. It answers **202** with a job to poll; the work runs in the background and
    ends as the **next version** of the file's dataset, shared with the same people and given a
    report of its own. The original is never touched. A cleaned version is not an upload: it uses
    no file quota, but it counts towards the plan's versions-per-dataset cap and appears in the
    audit log as `file.cleaned`. `saveRecipe` keeps the recipe for the dataset; `autoClean` (which
    needs `saveRecipe`, and a Basic or Premium plan, else 402) cleans every new version
    automatically. A cleaned version is never cleaned again.

CleaningController_job:
  summary: Read a cleaning job
  description: >-
    The job's `status` (`queued`, `running`, `succeeded` or `failed`), what each step did, the rows
    before and after, and, once it has succeeded, `resultFileId` (the new version) or, if it failed,
    the reason.

CleaningController_settings:
  summary: Read a dataset's saved settings
  description: >-
    The saved cleaning recipe, whether every new version is cleaned, and whether the plan offers
    that (`autoCleanAvailable`). A dataset with nothing saved answers with the defaults. Visible to
    anyone who can see the dataset.

CleaningController_saveSettings:
  summary: Save a dataset's settings
  description: >-
    Saves the cleaning recipe, whether to clean every new version, and/or the columns that identify
    a row. Any of them may be sent alone. The uploader of the latest version or an admin only.
    `autoClean` needs a saved recipe and a Basic or Premium plan (402 otherwise).

RowDiffController_view:
  summary: Read the row-by-row comparison of two versions
  description: >-
    What changed between two versions of one file **row by row**: rows added, removed, changed and
    unchanged, which columns changed most, and the first 500 changes with the old and the new value
    of each changed cell. Rows are matched by the dataset's key columns (`keyColumns`), ignoring case
    and surrounding spaces; columns are matched by name, so a reordered file does not look changed.
    `status` is `none` until a comparison has been asked for, `queued` or `running` while it is made,
    then `ready` or `failed` (with the reason in `errorMessage`). `suggestedKeyColumns` offers the
    columns whose names say they identify a row. Either order of the two ids names the older version
    first. Both versions must be visible to the caller (else 404) and belong to one dataset (else 422).

RowDiffController_start:
  summary: Compare two versions row by row
  description: >-
    Queues the comparison with the given `keyColumns` (up to 10), or with the ones saved for the
    dataset when none are given. Answers **202** with the comparison as it stands (`queued`); read it
    again with `GET` until it is `ready`. Asking again replaces the earlier result; asking while one
    is being made answers 409. A key column that one of the versions lacks makes the comparison fail
    with the reason. Files over 100,000 rows or 200 columns cannot be compared. Once the dataset has
    saved key columns every new version is compared with the one before it automatically, and the
    uploader and the admins are told (`dataset.changed`).

RowDiffController_csv:
  summary: Download every change as a CSV file
  description: >-
    Every added, removed and changed row, not only the first 500: a `change` column, the key columns,
    each column's value and, for a changed row, what each changed cell was before. Answers 409 until
    the comparison is `ready`.

ExploreController_run:
  summary: Run a query over a file's rows
  description: >-
    Filters, groups and totals **every row** of the file (up to 100,000 rows and 200 columns) on the
    server, without downloading it. Group by up to 2 columns; compute up to 4 measures per group
    (`count`, `sum`, `average`, `min`, `max`, `distinct`); filter with `equals`, `contains`, `greater`,
    `less`, `empty` and `not_empty`; sort and limit the groups. Columns are found by name, ignoring
    case and spaces. A sum, average, lowest or highest skips cells that are not numbers and says how
    many in `notes`. A column the file does not have, or a number asked of a column of text, answers
    422 with the reason. Free: it does not use the plan's questions. A file whose report is still
    being built answers 409. Needs the `files:read` scope for an API key.

ExploreController_ask:
  summary: Ask a file a question in words
  description: >-
    Turns a sentence such as "total revenue by region, highest first" into the same query `explore`
    takes, and runs it. The AI assistant is shown **only the question and each column's name and
    type, never a value**; the server validates the query it plans and runs it itself, and the answer
    is never sent back to the model. The response carries the planned query (`spec`), so it can be
    checked and adjusted, and the result. Counts against the plan's questions per billing period
    (Free 20, Basic 300, Premium 3,000): **402** once used up, pointing to `explore`, which is free.
    A question the assistant cannot answer from these columns is 422 with its reason, and an
    assistant that is switched off or does not answer is 503; neither is counted.

ExploreController_allowance:
  summary: How many questions are left this period
  description: >-
    Whether the AI assistant is available on this server (`aiAvailable`) and how many of the plan's
    questions the company has used this billing period. The query builder works either way.
