openapi: 3.0.0
paths:
  /subscriptions/plans:
    get:
      operationId: SubscriptionsController_plans
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDto'
      tags: &ref_0
        - subscriptions
      summary: List the plans
      description: >-
        The public plan catalog — limits and prices for Free, Basic and Premium.
        No account needed, so a pricing page can render it. Prices are integer
        cents. Seats are the admin plus employees, so Basic's 10 employees is 11
        seats.
  /subscriptions/me:
    get:
      operationId: SubscriptionsController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Get the company's subscription
      description: >-
        The current plan, its limits, usage so far this period (files,
        employees, seats), the period window and when it is next due. Available
        to admins and employees. Returns 404 until an admin has chosen a plan.
    post:
      operationId: SubscriptionsController_choose
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Choose the first plan
      description: >-
        The mandatory step after activation: features that need a plan answer
        402 until one is chosen. Admin only. Billing is anchored to today's day
        of the month; the first period starts at UTC midnight today. Returns 409
        if a plan already exists — use `PATCH /subscriptions/me` to change it.
    patch:
      operationId: SubscriptionsController_change
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            A UUID. A retry with the same key and body replays the first
            response instead of changing the plan (and billing the proration)
            twice.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeResultDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Change plan
      description: >-
        Upgrade or downgrade. A change is a new activation: the outgoing period
        is closed and invoiced for the days it ran (the switch day belongs to
        the new plan), and a fresh period opens today, re-anchoring billing to
        today's day of the month. `prorationCents` is the total of that closing
        invoice. Rejected with 409, naming the numbers, if the company is over
        the target plan's employee cap or (for Free and Basic) has already
        uploaded more files this period than it allows. Admin only.


        Send an `Idempotency-Key` (a UUID) so a retried request is not applied —
        or prorated and billed — twice: the same key with the same body replays
        the first response (`Idempotent-Replayed: true`); the same key with a
        different body is 422.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadFileBodyDoc:
      type: object
      properties:
        visibility:
          type: string
          enum: &ref_1
            - company
            - restricted
          default: company
        grantedUserIds:
          description: >-
            With `restricted`: the colleagues who may also see the file (the
            uploader and admins always can). Repeat the field, or send a JSON
            array. Empty means the uploader and admins only.
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileDto:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
          description: From the file's bytes, not from what the client claimed.
        sizeBytes:
          type: number
        visibility:
          type: string
          enum: *ref_1
        uploaderId:
          type: string
        grantedUserIds:
          nullable: true
          description: >-
            Who a restricted file is shared with. Shown only to the uploader and
            admins, and only on single-file responses; null everywhere else.
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - originalName
        - mimeType
        - sizeBytes
        - visibility
        - uploaderId
        - grantedUserIds
        - createdAt
    CursorMetaDto:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.
        hasMore:
          type: boolean
      required:
        - nextCursor
        - hasMore
    FilePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    FileDownloadDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            A short-lived link. Fetch it directly; it needs no Authorization
            header.
        expiresAt:
          type: string
          format: date-time
          description: The link stops working at this instant.
      required:
        - url
        - expiresAt
    UpdateFileDto:
      type: object
      properties:
        visibility:
          type: string
          enum: *ref_1
        grantedUserIds:
          description: >-
            REPLACES the set of colleagues granted access. Only meaningful for a
            `restricted` file; switching to `company` clears it.
          type: array
          items:
            type: string
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    BillingPeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: 'Exclusive, UTC midnight: when the next period starts.'
        days:
          type: number
      required:
        - start
        - end
        - days
    LineItemDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - seat
            - plan_base
            - overage
        description:
          type: string
          example: Employee seat
        unitCents:
          type: number
          description: The full price this line is a fraction of, in cents.
        amountCents:
          type: number
          description: What this line costs, in integer cents.
        userId:
          type: string
          description: 'seat: the employee this seat is for.'
        activeDays:
          type: number
          description: 'seat: days the employee was active in the period.'
        billedDays:
          type: number
          description: 'plan_base: days the plan was billed.'
        periodDays:
          type: number
          description: 'seat / plan_base: days in the whole period.'
        files:
          type: number
          description: 'overage: files beyond the plan’s included quota.'
      required:
        - kind
        - description
        - unitCents
        - amountCents
    StatementDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_2
            - free
            - basic
            - premium
        period:
          $ref: '#/components/schemas/BillingPeriodDto'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: >-
            What the invoice will be if nothing changes: employees active now
            are assumed to stay active to the end of the period, and files count
            as uploaded so far. Integer cents.
        seats:
          type: number
          description: 'Seats in use right now: the admin plus every active employee.'
        filesThisPeriod:
          type: number
          description: Files uploaded so far this period.
        dueDate:
          type: string
          format: date-time
          description: When the period ends and the invoice is finalized.
        asOf:
          type: string
          format: date-time
          description: When this statement was computed.
      required:
        - plan
        - period
        - lineItems
        - totalCents
        - seats
        - filesThisPeriod
        - dueDate
        - asOf
    InvoiceDto:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
          enum: *ref_2
          description: The plan that was live during the billed period.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
          description: >-
            Exclusive. Earlier than the period end when a plan change closed the
            period early.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: Integer cents.
        status:
          type: string
          enum:
            - finalized
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - plan
        - periodStart
        - periodEnd
        - lineItems
        - totalCents
        - status
        - dueDate
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    InvoicePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_2
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_3
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AcceptInviteDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the invitation email.
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum: &ref_4
            - admin
            - employee
        status:
          type: string
          enum: &ref_5
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_3
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    GoogleUrlDto:
      type: object
      properties:
        intent:
          type: string
          enum:
            - login
            - register
            - invite
          description: >-
            `login` and `register` behave identically (a known Google account
            signs in, an unknown one is offered company registration); the value
            is for the frontend. `invite` binds the Google account to the
            invited user.
        inviteToken:
          type: string
          description: 'Required for `invite`: the token from the invitation email.'
      required:
        - intent
    OAuthUrlDto:
      type: object
      properties:
        url:
          type: string
          description: Send the browser here. Google sends it back to the API callback.
      required:
        - url
    OAuthExchangeDto:
      type: object
      properties:
        code:
          type: string
          description: >-
            The single-use `code` from the redirect to
            `/session/oauth-complete`. Valid for 60 seconds.
      required:
        - code
    OAuthRegistrationTokenDto:
      type: object
      properties:
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
      required:
        - oauthRegistrationToken
    OAuthRegistrationPreviewDto:
      type: object
      properties:
        email:
          type: string
          nullable: true
          description: >-
            The address to prefill, or null when Google reported a relay/alias
            address (ask the person for one).
        emailVerified:
          type: boolean
          description: >-
            True when Google vouches for `email`; registration then needs no
            activation email.
        name:
          type: string
          nullable: true
      required:
        - email
        - emailVerified
        - name
    OAuthRegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_3
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - companyName
        - country
        - industry
        - oauthRegistrationToken
    OAuthRegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum:
            - pending_activation
            - active
        message:
          type: string
        session:
          nullable: true
          description: >-
            Present when Google vouched for the address, so the company is
            active at once and the person is signed in.
          type: object
          allOf:
            - $ref: '#/components/schemas/SessionDto'
      required:
        - companyId
        - userId
        - status
        - message
    IdentityDto:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
          enum:
            - password
            - google
        email:
          type: string
          nullable: true
          description: >-
            The address as that provider reports it; may differ from the work
            address.
        emailVerified:
          type: boolean
        lastUsedAt:
          format: date-time
          type: string
          nullable: true
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - provider
        - email
        - emailVerified
        - lastUsedAt
        - createdAt
    IdentityListDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDto'
      required:
        - data
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - fullName
    MemberDto:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
      required:
        - id
        - fullName
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_3
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
    InviteEmployeeDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
          description: Where the invitation is sent. Also the address they sign in with.
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - email
        - fullName
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invitations go to.
        fullName:
          type: string
        role:
          type: string
          enum: *ref_4
        status:
          type: string
          enum: *ref_5
        activatedAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
        - disabledAt
        - createdAt
    EmployeePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
