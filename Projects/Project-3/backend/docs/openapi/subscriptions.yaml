openapi: 3.0.0
paths:
  /subscriptions/plans:
    get:
      operationId: SubscriptionsController_plans
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlanDto'
      tags: &ref_0
        - subscriptions
      summary: List the plans
      description: >-
        The public plan catalog — limits and prices for Free, Basic and Premium.
        No account needed, so a pricing page can render it. Prices are integer
        cents. Seats are the admin plus employees, so Basic's 10 employees is 11
        seats.
  /subscriptions/me:
    get:
      operationId: SubscriptionsController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Get the company's subscription
      description: >-
        The current plan, its limits, usage so far this period (files,
        employees, seats), the period window and when it is next due. Available
        to admins and employees. Returns 404 until an admin has chosen a plan.
    post:
      operationId: SubscriptionsController_choose
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Choose the first plan
      description: >-
        The mandatory step after activation: features that need a plan answer
        402 until one is chosen. Admin only. Billing is anchored to today's day
        of the month; the first period starts at UTC midnight today. Returns 409
        if a plan already exists — use `PATCH /subscriptions/me` to change it.
    patch:
      operationId: SubscriptionsController_change
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChoosePlanDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanChangeResultDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Change plan
      description: >-
        Upgrade or downgrade. A change is a new activation: the outgoing period
        is closed and invoiced for the days it ran (the switch day belongs to
        the new plan), and a fresh period opens today, re-anchoring billing to
        today's day of the month. `prorationCents` is the total of that closing
        invoice. Rejected with 409, naming the numbers, if the company is over
        the target plan's employee cap or (for Free and Basic) has already
        uploaded more files this period than it allows. Admin only.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_1
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum:
            - admin
            - employee
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_1
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - fullName
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_1
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_2
            - free
            - basic
            - premium
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_2
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
