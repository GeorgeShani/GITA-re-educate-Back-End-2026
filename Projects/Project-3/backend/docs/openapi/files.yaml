openapi: 3.0.0
paths:
  /files:
    get:
      operationId: FilesController_list
      parameters:
        - name: cursor
          required: false
          in: query
          description: Opaque; take it from `meta.nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
        - name: sort
          required: false
          in: query
          description: A leading `-` is descending.
          schema:
            default: -createdAt
            type: string
            enum:
              - -createdAt
              - createdAt
        - name: mimeType
          required: false
          in: query
          schema:
            type: string
            enum:
              - text/csv
              - application/vnd.ms-excel
              - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        - name: visibility
          required: false
          in: query
          schema:
            type: string
            enum:
              - company
              - restricted
        - name: uploaderId
          required: false
          in: query
          schema:
            format: uuid
            type: string
        - name: search
          required: false
          in: query
          description: Files whose name contains this text, ignoring case.
          schema:
            maxLength: 100
            type: string
        - name: needsAttention
          required: false
          in: query
          description: >-
            Only files worth a second look: their report failed, or it finished
            with a score under 80.
          schema:
            default: false
            type: boolean
        - name: hasSensitiveData
          required: false
          in: query
          description: >-
            Only files whose report found a column that looks like personal or
            secret data.
          schema:
            default: false
            type: boolean
        - name: uploadedAfter
          required: false
          in: query
          description: Uploaded at or after this instant.
          schema:
            format: date-time
            type: string
        - name: uploadedBefore
          required: false
          in: query
          description: Uploaded before this instant.
          schema:
            format: date-time
            type: string
        - name: allVersions
          required: false
          in: query
          description: >-
            By default each file is listed once, as its newest version. `true`
            lists every version you can see.
          schema:
            default: false
            type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilePageDto'
      security: &ref_0
        - bearer: []
      tags: &ref_1
        - files
      summary: List files
      description: >-
        The files the caller may see: everything company-wide, plus restricted
        files they uploaded or were granted, and every file for an admin.
        Cursor-paginated, newest first (`sort=createdAt` reverses it); follow
        `meta.nextCursor` until `hasMore` is false. Filters (`mimeType`,
        `visibility`, `uploaderId`, `uploadedAfter`, `uploadedBefore`) only ever
        narrow that set. Rows never include where the bytes are stored or who a
        restricted file is shared with.


        A file that has several **versions** is listed once, as its newest
        version (`isLatest`); `allVersions=true` lists every version you can
        see. `datasetId` is shared by all the versions of one file.
    post:
      operationId: FilesController_upload
      parameters:
        - name: Idempotency-Key
          in: header
          description: >-
            A UUID. A retry with the same key and the same file replays the
            first response instead of uploading twice.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadFileBodyDoc'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: *ref_0
      tags: *ref_1
      summary: Upload a spreadsheet
      description: >-
        Multipart upload of a CSV, XLS or XLSX file up to 25 MB, with a
        `visibility` of `company` (the default) or `restricted` and, for a
        restricted file, `grantedUserIds` (repeat the field or send a JSON
        array; they must be active members of the company — get their ids from
        `GET /companies/me/members`). The type is decided from the file's
        **bytes**, never from its name or `Content-Type`: an executable renamed
        `report.csv` is refused with 400, as is a Word document renamed `.xls`.
        A refused, invalid or failed upload stores nothing and consumes no
        quota.


        **Quota.** Free (10 files per billing period) and Basic (100) answer
        **402** once the period's quota is used, naming the plan, the count, the
        cap and the date the quota resets — the upload never starts. Premium
        (1000 included) always accepts; a file past the 1000th carries an
        `X-Gridline-Quota-Warning` header and a $0.50 overage charge. Deleting a
        file does not refund its quota.


        **Idempotency.** Send an `Idempotency-Key` (a UUID) and a retry with the
        same key and the same file replays the first response — marked
        `Idempotent-Replayed: true`, warning header included — instead of
        uploading and counting twice. The same key with a different request is
        422; while the first request is still running, 409. A request that
        failed is not remembered.


        Each upload queues a data-quality report and is recorded in the audit
        log. Returns 413 above 25 MB.
  /files/{id}/versions:
    get:
      operationId: FilesController_versions
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: page
          required: false
          in: query
          schema:
            minimum: 1
            default: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersionPageDto'
      security: *ref_0
      tags: *ref_1
      summary: List a file's versions
      description: >-
        Every version of the file `id` belongs to that the caller may see,
        newest first, offset-paginated. Works from any of its versions. Versions
        the caller cannot see are left out, and a file you cannot see at all is
        a 404.
    post:
      operationId: FilesController_uploadVersion
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          description: >-
            A UUID. A retry with the same key and the same file replays the
            first response instead of uploading twice.
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadVersionBodyDoc'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: *ref_0
      tags: *ref_1
      summary: Upload a new version of a file
      description: >-
        Adds the next version to the file `id` belongs to (any of its versions
        will do): version 2, then 3, and so on. Multipart, with the same `file`
        part and the same rules as `POST /files` — the type is read from the
        bytes, up to 25 MB, `Idempotency-Key` is honoured — and it is a real
        upload: **it counts toward the period's file quota** and the plan's
        limit applies (402 past it, exactly like a new file), and it gets its
        own data-quality report.


        The new version becomes the file's **latest**. It inherits who can see
        the file — the visibility and the grants of the previous latest version,
        plus that version's uploader, so nobody loses the file because someone
        else uploaded the next version — and takes **no fields** of its own
        (sending one is a 400). After that each version's access is its own:
        `PATCH /files/{id}` changes one version only.


        Only the uploader or an admin may add a version: someone who can see the
        file but did not upload it gets 403, and a file you cannot see (or that
        was deleted) is a 404. Each plan keeps a number of versions per file
        (Free 5, Basic 50, Premium unlimited); beyond it the answer is 409
        naming the plan and the number, and deleting a version makes room.
        Version numbers are never reused. Needs the `files:write` scope for an
        API key.


        When the new version drops or retypes a column that the previous one
        had, the uploader and the admins get a `dataset.schema_changed`
        notification once its report is built.
  /files/{id}/compare/{otherId}:
    get:
      operationId: FilesController_compare
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: otherId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonDto'
      security: *ref_0
      tags: *ref_1
      summary: Compare two versions of a file
      description: >-
        What changed from `id` to `otherId` (normally an older version to a
        newer one), worked out from their stored data-quality reports — nothing
        is read from the files again. Both must be visible to you (a file you
        cannot see is a 404) and be versions of the same file (422 otherwise),
        and both reports must be `ready` (409 while one is still being built,
        422 when one failed or is unsupported).


        The answer lists `columnsAdded` and `columnsRemoved` (names ignore case,
        so a renamed header is one of each), `typeChanges` (a column whose
        dominant type changed), `nullPercentChanges` (empty cells moved by 5
        percentage points or more), the change in rows, columns, duplicate rows
        and quality score, and `schemaChanged`: true when a column was removed
        or retyped — the changes that break a reader of the data. New columns
        and shifts in blanks do not set it.
  /files/{id}:
    get:
      operationId: FilesController_get
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: *ref_0
      tags: *ref_1
      summary: Get a file
      description: >-
        A file the caller cannot see is **404**, never 403, so its existence is
        not disclosed. The uploader and admins also get `grantedUserIds`, the
        colleagues a restricted file is shared with.
    delete:
      operationId: FilesController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      security: *ref_0
      tags: *ref_1
      summary: Delete a file
      description: >-
        Uploader or admin only. A soft delete: the file disappears from every
        listing and its stored object is removed, but the row and its history
        are kept and the upload still counts toward this period's quota.
    patch:
      operationId: FilesController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFileDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDto'
      security: *ref_0
      tags: *ref_1
      summary: Change who can see a file
      description: >-
        Uploader or admin only. `visibility` switches between `company` and
        `restricted`; `grantedUserIds` REPLACES the set of colleagues granted
        access (only for a restricted file — switching to `company` clears it).
        A colleague who can see the file but did not upload it gets 403; someone
        who cannot see it gets 404. The change takes effect on the next request
        and is audited.
  /files/{id}/download:
    get:
      operationId: FilesController_download
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDownloadDto'
      security: *ref_0
      tags: *ref_1
      summary: Get a download link
      description: >-
        Checks the caller's access, then returns a signed link that expires in
        five minutes (`expiresAt`). The link needs no Authorization header; the
        browser saves it under the file's original name. With S3 storage it is a
        presigned S3 URL; with the development `local` driver it points at this
        API.
  /files/{id}/report:
    get:
      operationId: FilesController_report
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
      security: *ref_0
      tags: *ref_1
      summary: Get a file's data-quality report
      description: >-
        Every upload queues a report, so this is never a 404 for a file you can
        see. `status` moves `queued` → `profiling` → `ready`. When `ready`,
        `metrics` holds the row and column counts and, per column: the share of
        empty cells, the inferred type (`integer`, `number`, `boolean`, `date`,
        `string`), whether the column mixes kinds of value and by how much, and
        numeric min / max / mean; plus duplicate and empty rows, ragged rows and
        header problems. Only the first 100,000 rows are profiled;
        `metrics.truncated` says when the file was longer.


        `narrative` is a plain-language summary and recommendations written by
        an AI model from those statistics alone — it is never shown a row or a
        cell value. It is `null` when no AI provider is configured, or it timed
        out or answered unusably; the metrics are unaffected either way.


        `unsupported` means the file is stored but not profiled (legacy `.xls`:
        save it as `.xlsx` or `.csv`). `failed` means it could not be read
        (corrupt, malformed, or too large to open safely) — `errorMessage` says
        why; a report can also show `failed` briefly while a temporary problem
        is retried automatically. Visible exactly when the file is: a file you
        cannot see is a 404.


        **Quality rules.** When the company has data-quality rules
        (`/quality-rules`), `ruleResults` holds one result per enabled rule —
        `passed`, `failed`, or `skipped` when the rule does not apply to this
        file (its column is not in it, or holds no numbers) — each with the rule
        as it was when the report was built, and `qualityScore` (0–100) is the
        share of applicable rules passed, an `error` rule counting double a
        `warning`. Both are `null` when the company had no rules, and the score
        is also `null` when none of them applied. Editing or deleting a rule
        later does not change an existing report: rebuild it (`POST
        /files/{id}/report/rebuild`) to check it against the rules as they are
        now.
  /files/{id}/report/rebuild:
    post:
      operationId: FilesController_rebuildReport
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RebuildReportDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDto'
      security: *ref_0
      tags: *ref_1
      summary: Rebuild a file's report against today's rules
      description: >-
        Builds the report again from the same stored file, checking it against
        the company's quality rules as they are **now** — how an old file is
        re-checked after its rules changed. The uploader or an admin only
        (someone who can see the file but did not upload it gets 403; a file you
        cannot see is a 404). The report goes back to `queued` at once and the
        new result arrives as before (`file.status` over the realtime
        connection, or read the report again). Answers 409 while a build is
        already queued or running, so it cannot be requested twice. Needs the
        `files:write` scope for an API key.
  /files/{id}/preview:
    get:
      operationId: FilesController_preview
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewDto'
      security: *ref_0
      tags: *ref_1
      summary: Preview a file's first rows
      description: >-
        The first 50 rows of the file and the inferred type of each column, for
        rendering a table without downloading anything. Served from what
        profiling stored, so it costs no file read. Dates are ISO strings and
        long cells are cut to 200 characters. Returns 409 while the report is
        still being prepared, and 422 with the reason when no preview can be
        made (`unsupported` or `failed`). Visible exactly when the file is.
  /files/{id}/clean/preview:
    post:
      operationId: CleaningController_preview
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanPreviewDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanPreviewResultDto'
      security: &ref_2
        - bearer: []
      tags: &ref_3
        - files
      summary: Preview what a cleaning recipe would change
      description: >-
        Counts what each step of the recipe would do across the **whole** file
        and returns the first rows that change, each cell before and after.
        Nothing is written. Steps run in order; a step about a column the file
        does not have is skipped, not refused. A file over 100,000 rows or 200
        columns, or a legacy `.xls`, answers 422. The uploader or an admin only;
        a file you cannot see is a 404. Needs the `files:write` scope for an API
        key.
  /files/{id}/clean:
    post:
      operationId: CleaningController_clean
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CleanFileDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningJobDto'
      security: *ref_2
      tags: *ref_3
      summary: Clean a file as its next version
      description: >-
        Queues the recipe. It answers **202** with a job to poll; the work runs
        in the background and ends as the **next version** of the file's
        dataset, shared with the same people and given a report of its own. The
        original is never touched. A cleaned version is not an upload: it uses
        no file quota, but it counts towards the plan's versions-per-dataset cap
        and appears in the audit log as `file.cleaned`. `saveRecipe` keeps the
        recipe for the dataset; `autoClean` (which needs `saveRecipe`, and a
        Basic or Premium plan, else 402) cleans every new version automatically.
        A cleaned version is never cleaned again.
  /files/{id}/clean/jobs/{jobId}:
    get:
      operationId: CleaningController_job
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: jobId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleaningJobDto'
      security: *ref_2
      tags: *ref_3
      summary: Read a cleaning job
      description: >-
        The job's `status` (`queued`, `running`, `succeeded` or `failed`), what
        each step did, the rows before and after, and, once it has succeeded,
        `resultFileId` (the new version) or, if it failed, the reason.
  /datasets/{datasetId}/settings:
    get:
      operationId: CleaningController_settings
      parameters:
        - name: datasetId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSettingsDto'
      security: *ref_2
      tags: *ref_3
      summary: Read a dataset's saved settings
      description: >-
        The saved cleaning recipe, whether every new version is cleaned, and
        whether the plan offers that (`autoCleanAvailable`). A dataset with
        nothing saved answers with the defaults. Visible to anyone who can see
        the dataset.
    put:
      operationId: CleaningController_saveSettings
      parameters:
        - name: datasetId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetSettingsDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetSettingsDto'
      security: *ref_2
      tags: *ref_3
      summary: Save a dataset's settings
      description: >-
        Saves the cleaning recipe, whether to clean every new version, and/or
        the columns that identify a row. Any of them may be sent alone. The
        uploader of the latest version or an admin only. `autoClean` needs a
        saved recipe and a Basic or Premium plan (402 otherwise).
  /files/{id}/compare/{otherId}/rows:
    get:
      operationId: RowDiffController_view
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: otherId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowDiffDto'
      security: &ref_4
        - bearer: []
      tags: &ref_5
        - files
      summary: Read the row-by-row comparison of two versions
      description: >-
        What changed between two versions of one file **row by row**: rows
        added, removed, changed and unchanged, which columns changed most, and
        the first 500 changes with the old and the new value of each changed
        cell. Rows are matched by the dataset's key columns (`keyColumns`),
        ignoring case and surrounding spaces; columns are matched by name, so a
        reordered file does not look changed. `status` is `none` until a
        comparison has been asked for, `queued` or `running` while it is made,
        then `ready` or `failed` (with the reason in `errorMessage`).
        `suggestedKeyColumns` offers the columns whose names say they identify a
        row. Either order of the two ids names the older version first. Both
        versions must be visible to the caller (else 404) and belong to one
        dataset (else 422).
    post:
      operationId: RowDiffController_start
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: otherId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RowDiffRequestDto'
      responses:
        '202':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RowDiffDto'
      security: *ref_4
      tags: *ref_5
      summary: Compare two versions row by row
      description: >-
        Queues the comparison with the given `keyColumns` (up to 10), or with
        the ones saved for the dataset when none are given. Answers **202** with
        the comparison as it stands (`queued`); read it again with `GET` until
        it is `ready`. Asking again replaces the earlier result; asking while
        one is being made answers 409. A key column that one of the versions
        lacks makes the comparison fail with the reason. Files over 100,000 rows
        or 200 columns cannot be compared. Once the dataset has saved key
        columns every new version is compared with the one before it
        automatically, and the uploader and the admins are told
        (`dataset.changed`).
  /files/{id}/compare/{otherId}/rows.csv:
    get:
      operationId: RowDiffController_csv
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: otherId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Every change as a CSV file.
          content:
            text/csv:
              schema:
                type: string
      security: *ref_4
      tags: *ref_5
      summary: Download every change as a CSV file
      description: >-
        Every added, removed and changed row, not only the first 500: a `change`
        column, the key columns, each column's value and, for a changed row,
        what each changed cell was before. Answers 409 until the comparison is
        `ready`.
  /files/{id}/explore:
    post:
      operationId: ExploreController_run
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExploreRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryResultDto'
      security: &ref_6
        - bearer: []
      tags: &ref_7
        - files
      summary: Run a query over a file's rows
      description: >-
        Filters, groups and totals **every row** of the file (up to 100,000 rows
        and 200 columns) on the server, without downloading it. Group by up to 2
        columns; compute up to 4 measures per group (`count`, `sum`, `average`,
        `min`, `max`, `distinct`); filter with `equals`, `contains`, `greater`,
        `less`, `empty` and `not_empty`; sort and limit the groups. Columns are
        found by name, ignoring case and spaces. A sum, average, lowest or
        highest skips cells that are not numbers and says how many in `notes`. A
        column the file does not have, or a number asked of a column of text,
        answers 422 with the reason. Free: it does not use the plan's questions.
        A file whose report is still being built answers 409. Needs the
        `files:read` scope for an API key.
  /files/{id}/ask:
    post:
      operationId: ExploreController_ask
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequestDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResultDto'
      security: *ref_6
      tags: *ref_7
      summary: Ask a file a question in words
      description: >-
        Turns a sentence such as "total revenue by region, highest first" into
        the same query `explore` takes, and runs it. The AI assistant is shown
        **only the question and each column's name and type, never a value**;
        the server validates the query it plans and runs it itself, and the
        answer is never sent back to the model. The response carries the planned
        query (`spec`), so it can be checked and adjusted, and the result.
        Counts against the plan's questions per billing period (Free 20, Basic
        300, Premium 3,000): **402** once used up, pointing to `explore`, which
        is free. A question the assistant cannot answer from these columns is
        422 with its reason, and an assistant that is switched off or does not
        answer is 503; neither is counted.
  /files/{id}/ask/allowance:
    get:
      operationId: ExploreController_allowance
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllowanceDto'
      security: *ref_6
      tags: *ref_7
      summary: How many questions are left this period
      description: >-
        Whether the AI assistant is available on this server (`aiAvailable`) and
        how many of the plan's questions the company has used this billing
        period. The query builder works either way.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    StripeWebhookDto:
      type: object
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
        applied:
          type: boolean
      required:
        - received
        - duplicate
        - applied
    CreateWebhookEndpointDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
            enum: &ref_8
              - report.ready
              - report.failed
              - rules.failed
              - quota.threshold
              - invoice.finalized
              - file.uploaded
              - file.sensitive_data_found
              - dataset.changed
              - dataset.schema_changed
      required:
        - name
        - url
        - events
    CreatedWebhookEndpointDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items: &ref_9
            type: string
            enum: *ref_8
        active:
          type: boolean
        consecutiveFailures:
          type: number
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        secret:
          type: string
          description: Shown once. Store it in the receiver now.
      required:
        - id
        - name
        - url
        - events
        - active
        - consecutiveFailures
        - disabledAt
        - createdAt
        - secret
    WebhookEndpointDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items: *ref_9
        active:
          type: boolean
        consecutiveFailures:
          type: number
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - url
        - events
        - active
        - consecutiveFailures
        - disabledAt
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    WebhookEndpointPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    UpdateWebhookEndpointDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
            enum: *ref_8
        active:
          type: boolean
    RotatedWebhookSecretDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        secret:
          type: string
          description: Shown once. The previous secret no longer signs deliveries.
      required:
        - id
        - secret
    WebhookDeliveryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        attempts:
          type: number
        responseStatus:
          type: number
          nullable: true
        lastError:
          type: string
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventId
        - eventType
        - status
        - attempts
        - responseStatus
        - lastError
        - deliveredAt
        - createdAt
    WebhookDeliveryPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    UploadFileBodyDoc:
      type: object
      properties:
        visibility:
          type: string
          enum: &ref_10
            - company
            - restricted
          default: company
        grantedUserIds:
          description: >-
            With `restricted`: the colleagues who may also see the file (the
            uploader and admins always can). Repeat the field, or send a JSON
            array. Empty means the uploader and admins only.
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileDto:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
          description: From the file's bytes, not from what the client claimed.
        sizeBytes:
          type: number
        visibility:
          type: string
          enum: *ref_10
        datasetId:
          type: string
          format: uuid
          description: >-
            Shared by every version of one file. A first upload's is its own
            `id`.
        version:
          type: number
          description: >-
            Which version of the file this is: 1, 2, 3… Numbers are never
            reused.
        isLatest:
          type: boolean
          description: The newest version. A default list shows only these.
        uploaderId:
          type: string
        derivedFromFileId:
          type: string
          format: uuid
          nullable: true
          description: >-
            For a version made by cleaning: the version it was cleaned from.
            Null for an upload.
        grantedUserIds:
          nullable: true
          description: >-
            Who a restricted file is shared with. Shown only to the uploader and
            admins, and only on single-file responses; null everywhere else.
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - originalName
        - mimeType
        - sizeBytes
        - visibility
        - datasetId
        - version
        - isLatest
        - uploaderId
        - derivedFromFileId
        - grantedUserIds
        - createdAt
    UploadVersionBodyDoc:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileVersionPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    ComparedFileDto:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        version:
          type: number
        originalName:
          type: string
      required:
        - fileId
        - version
        - originalName
    TypeChangeDto:
      type: object
      properties:
        column:
          type: string
        from:
          type: string
          enum: &ref_11
            - integer
            - number
            - boolean
            - date
            - string
            - empty
        to:
          type: string
          enum: *ref_11
      required:
        - column
        - from
        - to
    NullPercentChangeDto:
      type: object
      properties:
        column:
          type: string
        from:
          type: number
          description: Percent empty in `from`.
        to:
          type: number
          description: Percent empty in `to`.
        delta:
          type: number
          description: Percentage points; positive means more empty cells.
      required:
        - column
        - from
        - to
        - delta
    CountChangeDto:
      type: object
      properties:
        from:
          type: number
          nullable: true
        to:
          type: number
          nullable: true
        delta:
          type: number
          nullable: true
          description: '`to` minus `from`; null when either side has no value.'
      required:
        - from
        - to
        - delta
    ComparisonDto:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/ComparedFileDto'
        to:
          $ref: '#/components/schemas/ComparedFileDto'
        columnsAdded:
          description: >-
            In `to` but not in `from` (names ignore case; a renamed header is
            one removed and one added).
          type: array
          items:
            type: string
        columnsRemoved:
          description: In `from` but not in `to`.
          type: array
          items:
            type: string
        typeChanges:
          description: >-
            Columns whose dominant type changed. A column that is empty on
            either side has no type to compare.
          type: array
          items:
            $ref: '#/components/schemas/TypeChangeDto'
        nullPercentChanges:
          description: >-
            Columns whose share of empty cells moved by 5 percentage points or
            more.
          type: array
          items:
            $ref: '#/components/schemas/NullPercentChangeDto'
        rowCount:
          $ref: '#/components/schemas/CountChangeDto'
        columnCount:
          $ref: '#/components/schemas/CountChangeDto'
        duplicateRows:
          $ref: '#/components/schemas/CountChangeDto'
        qualityScore:
          description: The quality score; `delta` is null when either file was not scored.
          allOf:
            - $ref: '#/components/schemas/CountChangeDto'
        schemaChanged:
          type: boolean
          description: >-
            A column was removed or changed type — what breaks a reader of the
            data. New columns and shifts in blanks do not count.
      required:
        - from
        - to
        - columnsAdded
        - columnsRemoved
        - typeChanges
        - nullPercentChanges
        - rowCount
        - columnCount
        - duplicateRows
        - qualityScore
        - schemaChanged
    CursorMetaDto:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.
        hasMore:
          type: boolean
      required:
        - nextCursor
        - hasMore
    FilePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    FileDownloadDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            A short-lived link. Fetch it directly; it needs no Authorization
            header.
        expiresAt:
          type: string
          format: date-time
          description: The link stops working at this instant.
      required:
        - url
        - expiresAt
    SheetInfoDto:
      type: object
      properties:
        name:
          type: string
          description: The worksheet that was profiled.
        others:
          description: >-
            The other worksheets that have rows. They are stored with the file
            but not profiled; choose one with `POST /files/{id}/report/rebuild`.
          type: array
          items:
            type: string
      required:
        - name
        - others
    TypeCountsDto:
      type: object
      properties:
        integer:
          type: number
        number:
          type: number
        boolean:
          type: number
        date:
          type: number
        string:
          type: number
      required:
        - integer
        - number
        - boolean
        - date
        - string
    NumericStatsDto:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        mean:
          type: number
      required:
        - min
        - max
        - mean
    SensitiveDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - email
            - phone
            - card_number
            - iban
            - ip_address
            - secret
            - birth_date
          description: What the column looks like it holds.
        matchPercent:
          type: number
          description: >-
            Share of the column's checked, non-empty values that look like this,
            0–100.
      required:
        - kind
        - matchPercent
    ColumnMetricsDto:
      type: object
      properties:
        index:
          type: number
        name:
          type: string
        nullCount:
          type: number
          description: Blank and whitespace-only cells count as empty.
        nullPercent:
          type: number
          description: Percent of the column that is empty, 0–100, two decimals.
        inferredType:
          type: string
          enum: *ref_11
          description: The dominant kind of value in the column.
        typeCounts:
          $ref: '#/components/schemas/TypeCountsDto'
        inconsistent:
          type: boolean
          description: More than one kind of value in the column (numbers AND text, say).
        inconsistentPercent:
          type: number
          description: Percent of non-empty cells that disagree with the dominant type.
        numeric:
          nullable: true
          description: Over the numeric cells; null if there are none.
          type: object
          allOf:
            - $ref: '#/components/schemas/NumericStatsDto'
        sensitive:
          nullable: true
          description: >-
            Set when the column looks like it holds personal or secret data
            (found by patterns and checksums, never by a model). Only the kind
            and share are kept, never a value.
          type: object
          allOf:
            - $ref: '#/components/schemas/SensitiveDto'
      required:
        - index
        - name
        - nullCount
        - nullPercent
        - inferredType
        - typeCounts
        - inconsistent
        - inconsistentPercent
        - numeric
        - sensitive
    MetricsDto:
      type: object
      properties:
        rowCount:
          type: number
          description: Data rows profiled, header excluded.
        columnCount:
          type: number
        emptyRows:
          type: number
          description: Rows with no value in any column.
        duplicateRows:
          type: number
          description: Rows identical to an earlier row.
        raggedRows:
          type: number
          description: Rows with more or fewer cells than the header.
        truncated:
          type: boolean
          description: >-
            True when the file had more rows than the profile budget: the
            numbers cover the first `rowBudget` rows.
        rowBudget:
          type: number
        headerIssues:
          description: Problems with the header row (blank or repeated names).
          type: array
          items:
            type: string
        sheet:
          nullable: true
          description: Which worksheet of a workbook this report covers. Null for a CSV.
          type: object
          allOf:
            - $ref: '#/components/schemas/SheetInfoDto'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMetricsDto'
      required:
        - rowCount
        - columnCount
        - emptyRows
        - duplicateRows
        - raggedRows
        - truncated
        - rowBudget
        - headerIssues
        - sheet
        - columns
    NarrativeDto:
      type: object
      properties:
        summary:
          type: string
        recommendations:
          type: array
          items:
            type: string
        model:
          type: string
          description: The model that wrote it.
      required:
        - summary
        - recommendations
        - model
    RuleResultDto:
      type: object
      properties:
        ruleId:
          type: string
          description: >-
            The rule this result is for (it may have been edited or deleted
            since).
        name:
          type: string
        kind:
          type: string
          enum: &ref_16
            - required_column
            - max_null_percent
            - type_is
            - min_value
            - max_value
            - unique
            - max_duplicate_rows
            - no_sensitive_data
        columnName:
          type: string
          nullable: true
        severity:
          type: string
          enum: &ref_17
            - error
            - warning
        status:
          type: string
          enum:
            - passed
            - failed
            - skipped
          description: >-
            `skipped`: the rule does not apply to this file (its column is not
            in it, or holds no numbers).
        message:
          type: string
          description: What was found and what was required, in words.
        params:
          type: object
          additionalProperties: true
          description: What the rule required when this report was built.
      required:
        - ruleId
        - name
        - kind
        - columnName
        - severity
        - status
        - message
        - params
    ReportDto:
      type: object
      properties:
        fileId:
          type: string
        status:
          type: string
          enum:
            - queued
            - profiling
            - ready
            - unsupported
            - failed
        metrics:
          nullable: true
          description: Present once `status` is `ready`.
          type: object
          allOf:
            - $ref: '#/components/schemas/MetricsDto'
        narrative:
          nullable: true
          description: >-
            The plain-language summary. Null when no AI provider is configured
            or it produced nothing usable; the metrics are unaffected.
          type: object
          allOf:
            - $ref: '#/components/schemas/NarrativeDto'
        errorMessage:
          type: string
          nullable: true
          description: Why the report is `failed` or `unsupported`.
        profiledAt:
          type: string
          format: date-time
          nullable: true
        qualityScore:
          type: number
          nullable: true
          description: >-
            How the file did against the company’s quality rules, 0–100: the
            share of applicable rules it passed, an `error` rule counting double
            a `warning`. Null when no rule applied (or none is defined).
        ruleResults:
          nullable: true
          description: >-
            One result per rule the company had when this report was built, each
            carrying the rule as it was then (rules can be edited later). Null
            when the company had no rules. Rebuild the report to check against
            today’s rules.
          type: array
          items:
            $ref: '#/components/schemas/RuleResultDto'
        sensitiveColumns:
          type: number
          description: >-
            How many columns look like they hold personal or secret data (see
            `metrics.columns[].sensitive`). 0 until the report is ready.
      required:
        - fileId
        - status
        - metrics
        - narrative
        - errorMessage
        - profiledAt
        - qualityScore
        - ruleResults
        - sensitiveColumns
    RebuildReportDto:
      type: object
      properties:
        sheet:
          type: string
          description: >-
            For a workbook with several worksheets: the one to profile. It must
            be one of the sheets the report names (`metrics.sheet`). Omit to
            keep the sheet already chosen.
          example: Sales
    PreviewColumnDto:
      type: object
      properties:
        name:
          type: string
        inferredType:
          type: string
          enum: *ref_11
      required:
        - name
        - inferredType
    PreviewDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/PreviewColumnDto'
        rows:
          type: array
          items:
            type: array
            items:
              nullable: true
              oneOf:
                - type: string
                - type: number
                - type: boolean
          description: >-
            The first rows, one array of cells per row in column order. Dates
            are ISO strings.
        totalRows:
          type: number
          description: Rows in the file (up to the profile budget).
        truncated:
          type: boolean
          description: True when `rows` is only the first part of the file.
      required:
        - columns
        - rows
        - totalRows
        - truncated
    UpdateFileDto:
      type: object
      properties:
        visibility:
          type: string
          enum: *ref_10
        grantedUserIds:
          description: >-
            REPLACES the set of colleagues granted access. Only meaningful for a
            `restricted` file; switching to `company` clears it.
          type: array
          items:
            type: string
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    CleanPreviewDto:
      type: object
      properties:
        recipe:
          type: object
          additionalProperties: true
          description: >-
            The steps, in order: `{ "steps": [ { "step": "trim_whitespace" }, {
            "step": "standardise_dates", "column": "when", "order": "dmy" } ]
            }`. Steps: `trim_whitespace`, `tidy_headers`, `drop_empty_rows`,
            `drop_duplicate_rows`, `standardise_dates`, `parse_numbers`,
            `replace_values`, `fill_empty`, `change_case`, `rename_column`,
            `drop_column`, `mask_column`. A step about a column the file does
            not have is skipped, not refused.
        sheet:
          type: string
          description: >-
            For a workbook with several sheets: the one to clean. Omit for the
            sheet the report covers.
          example: Sales
      required:
        - recipe
    StepOutcomeDto:
      type: object
      properties:
        step:
          type: string
          enum:
            - trim_whitespace
            - tidy_headers
            - drop_empty_rows
            - drop_duplicate_rows
            - standardise_dates
            - parse_numbers
            - replace_values
            - fill_empty
            - change_case
            - rename_column
            - drop_column
            - mask_column
        label:
          type: string
          description: The step in words, e.g. "Trim spaces in Name".
        changed:
          type: number
          description: >-
            Cells changed (or rows or columns removed, for the steps that do
            that).
        skipped:
          type: string
          nullable: true
          description: Why the step did nothing, when it did not apply.
        notes:
          description: Things worth saying, e.g. values that could not be read as dates.
          type: array
          items:
            type: string
      required:
        - step
        - label
        - changed
        - skipped
        - notes
    SampleCellDto:
      type: object
      properties:
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
        - before
        - after
    SampleRowDto:
      type: object
      properties:
        row:
          type: number
          description: >-
            The row's number in the file as uploaded, counting the header as row
            1.
        cells:
          description: One per column of the cleaned file, in order.
          type: array
          items:
            $ref: '#/components/schemas/SampleCellDto'
      required:
        - row
        - cells
    CleanPreviewResultDto:
      type: object
      properties:
        rowsBefore:
          type: number
        rowsAfter:
          type: number
        columns:
          description: The columns the cleaned file would have.
          type: array
          items:
            type: string
        steps:
          description: What each step did, counted over the WHOLE file.
          type: array
          items:
            $ref: '#/components/schemas/StepOutcomeDto'
        samples:
          description: The first rows the steps change, each cell before and after.
          type: array
          items:
            $ref: '#/components/schemas/SampleRowDto'
      required:
        - rowsBefore
        - rowsAfter
        - columns
        - steps
        - samples
    CleanFileDto:
      type: object
      properties:
        recipe:
          type: object
          additionalProperties: true
          description: >-
            The steps, in order: `{ "steps": [ { "step": "trim_whitespace" }, {
            "step": "standardise_dates", "column": "when", "order": "dmy" } ]
            }`. Steps: `trim_whitespace`, `tidy_headers`, `drop_empty_rows`,
            `drop_duplicate_rows`, `standardise_dates`, `parse_numbers`,
            `replace_values`, `fill_empty`, `change_case`, `rename_column`,
            `drop_column`, `mask_column`. A step about a column the file does
            not have is skipped, not refused.
        sheet:
          type: string
          description: >-
            For a workbook with several sheets: the one to clean. Omit for the
            sheet the report covers.
          example: Sales
        saveRecipe:
          type: boolean
          description: >-
            Keep this recipe for the file (its dataset), so it is offered again
            next time.
          default: false
        autoClean:
          type: boolean
          description: >-
            Clean every NEW version of this dataset with this recipe, keeping
            each upload as it arrived and adding the cleaned data after it.
            Needs `saveRecipe`, and a Basic or Premium plan.
          default: false
      required:
        - recipe
    CleaningJobDto:
      type: object
      properties:
        id:
          type: string
        fileId:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        trigger:
          type: string
          enum:
            - manual
            - auto
          description: >-
            `auto` when a dataset's "clean every new version" setting started
            it.
        resultFileId:
          type: string
          nullable: true
          description: The new version, once it exists.
        errorMessage:
          type: string
          nullable: true
        steps:
          description: What each step did; empty until the job has run.
          type: array
          items:
            $ref: '#/components/schemas/StepOutcomeDto'
        rowsBefore:
          type: number
          nullable: true
        rowsAfter:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fileId
        - status
        - trigger
        - resultFileId
        - errorMessage
        - steps
        - rowsBefore
        - rowsAfter
        - createdAt
    DatasetSettingsDto:
      type: object
      properties:
        datasetId:
          type: string
        keyColumns:
          description: >-
            The columns that together identify a row, for comparing two versions
            row by row.
          type: array
          items:
            type: string
        recipe:
          type: object
          additionalProperties: true
          nullable: true
          description: The saved cleaning recipe, or null.
        autoClean:
          type: boolean
          description: Every new version is cleaned with the saved recipe.
        autoCleanAvailable:
          type: boolean
          description: Whether this company's plan includes automatic cleaning.
      required:
        - datasetId
        - keyColumns
        - recipe
        - autoClean
        - autoCleanAvailable
    UpdateDatasetSettingsDto:
      type: object
      properties:
        keyColumns:
          description: REPLACES the key columns.
          type: array
          items:
            type: string
        recipe:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            The cleaning recipe to keep; `null` removes it (and switches
            automatic cleaning off).
        autoClean:
          type: boolean
          description: >-
            Clean every new version automatically. Needs a saved recipe, and a
            Basic or Premium plan.
    RowDiffVersionDto:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        version:
          type: number
        originalName:
          type: string
      required:
        - fileId
        - version
        - originalName
    ColumnChangeCountDto:
      type: object
      properties:
        column:
          type: string
        changed:
          type: number
      required:
        - column
        - changed
    RowDiffSummaryDto:
      type: object
      properties:
        keyColumns:
          type: array
          items:
            type: string
        rowsBefore:
          type: number
        rowsAfter:
          type: number
        added:
          type: number
        removed:
          type: number
        changed:
          type: number
        unchanged:
          type: number
        unmatchable:
          type: number
          description: >-
            Rows with an empty key, or a key that appears more than once, in
            either version. They cannot be matched and are not counted above.
        columnsChanged:
          description: >-
            Columns in both versions, with how many rows changed in each, most
            first.
          type: array
          items:
            $ref: '#/components/schemas/ColumnChangeCountDto'
        columnsAdded:
          type: array
          items:
            type: string
        columnsRemoved:
          type: array
          items:
            type: string
      required:
        - keyColumns
        - rowsBefore
        - rowsAfter
        - added
        - removed
        - changed
        - unchanged
        - unmatchable
        - columnsChanged
        - columnsAdded
        - columnsRemoved
    ChangedCellDto:
      type: object
      properties:
        column:
          type: string
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
        - column
        - before
        - after
    RowChangeDto:
      type: object
      properties:
        change:
          type: string
          enum:
            - added
            - removed
            - changed
        key:
          description: The values of the key columns, in the order of `keyColumns`.
          type: array
          items:
            type: string
        cells:
          description: >-
            For a changed row only the cells that differ; for an added or
            removed row every cell.
          type: array
          items:
            $ref: '#/components/schemas/ChangedCellDto'
      required:
        - change
        - key
        - cells
    RowDiffDto:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/RowDiffVersionDto'
        to:
          $ref: '#/components/schemas/RowDiffVersionDto'
        status:
          type: string
          enum:
            - queued
            - running
            - ready
            - failed
            - none
          description: >-
            `none` until a comparison has been asked for (or made
            automatically).
        keyColumns:
          description: >-
            The columns the comparison used or, before one is made, those saved
            for the dataset.
          type: array
          items:
            type: string
        suggestedKeyColumns:
          description: >-
            Columns whose names say they identify a row, found in both versions:
            a suggestion to confirm.
          type: array
          items:
            type: string
        summary:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/RowDiffSummaryDto'
        sample:
          description: >-
            The first 500 changes: rows removed, then added, then changed. All
            of them are in the CSV.
          type: array
          items:
            $ref: '#/components/schemas/RowChangeDto'
        errorMessage:
          type: string
          nullable: true
          description: Why a comparison could not be made.
      required:
        - from
        - to
        - status
        - keyColumns
        - suggestedKeyColumns
        - summary
        - sample
        - errorMessage
    RowDiffRequestDto:
      type: object
      properties:
        keyColumns:
          description: >-
            The columns that together identify a row (up to 10), so a row in one
            version can be matched with the same row in the other. Omit to use
            the ones saved for the dataset (`PUT
            /datasets/{datasetId}/settings`).
          example:
            - customer_id
          type: array
          items:
            type: string
    ExploreRequestDto:
      type: object
      properties:
        query:
          type: object
          additionalProperties: true
          description: >-
            A query: `filters` (each `{ column, op, value }`; `op` is `equals`,
            `contains`, `greater`, `less`, `empty` or `not_empty`), `groupBy`
            (up to 2 columns), `measures` (1 to 4 of `{ fn, column }`; `fn` is
            `count`, `sum`, `average`, `min`, `max` or `distinct`; `count` takes
            no column), an optional `sort` (`{ by: "group" | "measure", index,
            direction: "asc" | "desc" }`) and a `limit` (1 to 200, default 50).
            Example: `{ "groupBy": ["region"], "measures": [{ "fn": "sum",
            "column": "revenue" }], "sort": { "by": "measure", "index": 0,
            "direction": "desc" } }`.
      required:
        - query
    ResultColumnDto:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
            - group
            - measure
      required:
        - name
        - kind
    QueryResultDto:
      type: object
      properties:
        columns:
          description: The group-by columns first, then one column per measure.
          type: array
          items:
            $ref: '#/components/schemas/ResultColumnDto'
        rows:
          type: array
          items:
            type: array
            items:
              oneOf:
                - type: string
                - type: number
              nullable: true
          description: >-
            One row per group (one row in all when there is no `groupBy`), cells
            in the order of `columns`. A measure that has nothing to work on is
            null.
        rowsMatched:
          type: number
          description: Rows that passed the filters.
        rowsScanned:
          type: number
          description: Rows in the file.
        groupCount:
          type: number
          description: How many groups there were before `limit` cut the list.
        notes:
          description: >-
            Things worth saying, such as cells that were not numbers and were
            left out.
          type: array
          items:
            type: string
      required:
        - columns
        - rows
        - rowsMatched
        - rowsScanned
        - groupCount
        - notes
    AskRequestDto:
      type: object
      properties:
        question:
          type: string
          description: >-
            A question about the file, in words. The assistant is shown it and
            the column names and types, never a value.
          example: Total revenue by region, highest first
      required:
        - question
    AskResultDto:
      type: object
      properties:
        question:
          type: string
        spec:
          type: object
          additionalProperties: true
          description: >-
            The query the assistant planned, validated and run by the server. A
            query: `filters` (each `{ column, op, value }`; `op` is `equals`,
            `contains`, `greater`, `less`, `empty` or `not_empty`), `groupBy`
            (up to 2 columns), `measures` (1 to 4 of `{ fn, column }`; `fn` is
            `count`, `sum`, `average`, `min`, `max` or `distinct`; `count` takes
            no column), an optional `sort` (`{ by: "group" | "measure", index,
            direction: "asc" | "desc" }`) and a `limit` (1 to 200, default 50).
            Example: `{ "groupBy": ["region"], "measures": [{ "fn": "sum",
            "column": "revenue" }], "sort": { "by": "measure", "index": 0,
            "direction": "desc" } }`.
        result:
          $ref: '#/components/schemas/QueryResultDto'
        model:
          type: string
          nullable: true
          description: The model that planned the query.
        questionsUsed:
          type: number
          description: Questions answered so far this billing period, this one included.
        questionsLimit:
          type: number
          description: Questions the plan answers a billing period.
      required:
        - question
        - spec
        - result
        - model
        - questionsUsed
        - questionsLimit
    AllowanceDto:
      type: object
      properties:
        aiAvailable:
          type: boolean
          description: >-
            False when the AI assistant is switched off on this server: the
            query builder still works.
        questionsUsed:
          type: number
        questionsLimit:
          type: number
      required:
        - aiAvailable
        - questionsUsed
        - questionsLimit
    BillingPeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: 'Exclusive, UTC midnight: when the next period starts.'
        days:
          type: number
      required:
        - start
        - end
        - days
    LineItemDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - seat
            - plan_base
            - overage
        description:
          type: string
          example: Employee seat
        unitCents:
          type: number
          description: The full price this line is a fraction of, in cents.
        amountCents:
          type: number
          description: What this line costs, in integer cents.
        userId:
          type: string
          description: 'seat: the employee this seat is for.'
        activeDays:
          type: number
          description: 'seat: days the employee was active in the period.'
        billedDays:
          type: number
          description: 'plan_base: days the plan was billed.'
        periodDays:
          type: number
          description: 'seat / plan_base: days in the whole period.'
        files:
          type: number
          description: 'overage: files beyond the plan’s included quota.'
      required:
        - kind
        - description
        - unitCents
        - amountCents
    StatementDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_12
            - free
            - basic
            - premium
        period:
          $ref: '#/components/schemas/BillingPeriodDto'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: >-
            What the invoice will be if nothing changes: employees active now
            are assumed to stay active to the end of the period, and files count
            as uploaded so far. Integer cents.
        seats:
          type: number
          description: 'Seats in use right now: the admin plus every active employee.'
        filesThisPeriod:
          type: number
          description: Files uploaded so far this period.
        dueDate:
          type: string
          format: date-time
          description: When the period ends and the invoice is finalized.
        asOf:
          type: string
          format: date-time
          description: When this statement was computed.
      required:
        - plan
        - period
        - lineItems
        - totalCents
        - seats
        - filesThisPeriod
        - dueDate
        - asOf
    InvoiceDto:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
          enum: *ref_12
          description: The plan that was live during the billed period.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
          description: >-
            Exclusive. Earlier than the period end when a plan change closed the
            period early.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: Integer cents.
        status:
          type: string
          enum:
            - finalized
            - draft
            - open
            - paid
            - uncollectible
            - void
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          enum:
            - local
            - stripe
        stripeHostedInvoiceUrl:
          type: object
          nullable: true
        stripeInvoicePdfUrl:
          type: object
          nullable: true
        currency:
          type: object
          nullable: true
        paymentAttempts:
          type: number
        paidAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - plan
        - periodStart
        - periodEnd
        - lineItems
        - totalCents
        - status
        - dueDate
        - createdAt
        - provider
        - paymentAttempts
    InvoicePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    PortalSessionDto:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
        - url
    NotificationDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - quota.threshold
            - report.ready
            - report.failed
            - rules.failed
            - file.sensitive_data
            - dataset.schema_changed
            - file.cleaned
            - cleaning.failed
            - dataset.changed
            - file.shared
            - invoice.finalized
            - comment.mentioned
          description: What happened. Decides the shape of `payload`.
        payload:
          type: object
          additionalProperties: true
          description: >-
            Ids, counts and names for this `type` — never cell values. For
            `quota.threshold`: `threshold`, `plan`, `filesUsed`, `filesLimit`,
            `upgradeTo`. For `report.ready`/`report.failed`: `fileId`,
            `fileName`. For `file.shared`: `fileId`, `fileName`,
            `sharedByUserId`. For `invoice.finalized`: `invoiceId`,
            `totalCents`.
        readAt:
          type: string
          format: date-time
          nullable: true
          description: Null while unread.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - type
        - payload
        - readAt
        - createdAt
    NotificationPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NotificationDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    UnreadCountDto:
      type: object
      properties:
        count:
          type: number
          description: How many of your notifications are unread.
      required:
        - count
    MarkedReadDto:
      type: object
      properties:
        updated:
          type: number
          description: How many notifications this call marked as read.
      required:
        - updated
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_12
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
        rateLimitPerMinute:
          type: number
          description: >-
            Requests per minute the whole company may make, shared by its users
            and API keys.
        maxQualityRules:
          type: number
          nullable: true
          description: >-
            Data-quality rules the company may keep, enabled or not; null =
            unlimited.
        maxVersionsPerDataset:
          type: number
          nullable: true
          description: >-
            Versions one file may hold (an uploaded version counts toward the
            file quota, a cleaned one does not); null = unlimited.
        questionsPerPeriod:
          type: number
          description: >-
            Plain-language questions the AI assistant may answer about your
            files per billing period. The query builder is not counted.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
        - rateLimitPerMinute
        - maxQualityRules
        - maxVersionsPerDataset
        - questionsPerPeriod
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_12
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_12
      required:
        - plan
    PendingPlanDto:
      type: object
      properties:
        state:
          type: string
          enum:
