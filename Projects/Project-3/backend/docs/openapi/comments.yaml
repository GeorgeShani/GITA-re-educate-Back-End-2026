openapi: 3.0.0
paths:
  /files/{id}/comments:
    get:
      operationId: FileCommentsController_list
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: cursor
          required: false
          in: query
          description: Opaque; take it from `meta.nextCursor` of the previous page.
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            minimum: 1
            maximum: 100
            default: 20
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentPageDto'
      security:
        - bearer: []
      tags:
        - comments
      summary: List a file's comment thread
      description: >-
        Lists comments oldest first with cursor pagination. The same visibility
        rule as the file applies: callers who cannot see the file receive 404.
        Deleted comments remain as bodyless tombstones so replies keep their
        place. A personal API key needs `files:read`.
    post:
      operationId: CommentMutationsController_create
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
      security: &ref_0
        - bearer: []
      tags: &ref_1
        - comments
      summary: Comment on a file
      description: >-
        Creates a top-level comment or a one-level reply. Mentioned users must
        be active company members who can already see the file; mentioning
        someone never grants access. Newly mentioned people receive an inbox
        notification. Session authentication is required—API keys cannot create
        comments.
  /comments/{id}:
    delete:
      operationId: CommentMutationsController_remove
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
      security: *ref_0
      tags: *ref_1
      summary: Delete a comment
      description: >-
        Authors and company admins may delete a comment. Deletion preserves a
        bodyless tombstone, clears all mention rows, and leaves replies in
        place. Repeating the request is safe. Session authentication is
        required.
    patch:
      operationId: CommentMutationsController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCommentDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDto'
      security: *ref_0
      tags: *ref_1
      summary: Edit your comment
      description: >-
        Authors may replace the body and mention set of a live comment. Only
        newly added mentions are notified. Comment text is never copied into
        audit metadata. Session authentication is required.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    StripeWebhookDto:
      type: object
      properties:
        received:
          type: boolean
        duplicate:
          type: boolean
        applied:
          type: boolean
      required:
        - received
        - duplicate
        - applied
    CreateWebhookEndpointDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
            enum: &ref_2
              - report.ready
              - report.failed
              - rules.failed
              - quota.threshold
              - invoice.finalized
              - file.uploaded
              - file.sensitive_data_found
              - dataset.changed
              - dataset.schema_changed
      required:
        - name
        - url
        - events
    CreatedWebhookEndpointDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items: &ref_3
            type: string
            enum: *ref_2
        active:
          type: boolean
        consecutiveFailures:
          type: number
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        secret:
          type: string
          description: Shown once. Store it in the receiver now.
      required:
        - id
        - name
        - url
        - events
        - active
        - consecutiveFailures
        - disabledAt
        - createdAt
        - secret
    WebhookEndpointDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items: *ref_3
        active:
          type: boolean
        consecutiveFailures:
          type: number
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - url
        - events
        - active
        - consecutiveFailures
        - disabledAt
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    WebhookEndpointPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpointDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    UpdateWebhookEndpointDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          items:
            type: string
            enum: *ref_2
        active:
          type: boolean
    RotatedWebhookSecretDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        secret:
          type: string
          description: Shown once. The previous secret no longer signs deliveries.
      required:
        - id
        - secret
    WebhookDeliveryDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        eventType:
          type: string
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
        attempts:
          type: number
        responseStatus:
          type: number
          nullable: true
        lastError:
          type: string
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - eventId
        - eventType
        - status
        - attempts
        - responseStatus
        - lastError
        - deliveredAt
        - createdAt
    WebhookDeliveryPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDeliveryDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    UploadFileBodyDoc:
      type: object
      properties:
        visibility:
          type: string
          enum: &ref_4
            - company
            - restricted
          default: company
        grantedUserIds:
          description: >-
            With `restricted`: the colleagues who may also see the file (the
            uploader and admins always can). Repeat the field, or send a JSON
            array. Empty means the uploader and admins only.
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileDto:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
          description: From the file's bytes, not from what the client claimed.
        sizeBytes:
          type: number
        visibility:
          type: string
          enum: *ref_4
        datasetId:
          type: string
          format: uuid
          description: >-
            Shared by every version of one file. A first upload's is its own
            `id`.
        version:
          type: number
          description: >-
            Which version of the file this is: 1, 2, 3… Numbers are never
            reused.
        isLatest:
          type: boolean
          description: The newest version. A default list shows only these.
        uploaderId:
          type: string
        derivedFromFileId:
          type: string
          format: uuid
          nullable: true
          description: >-
            For a version made by cleaning: the version it was cleaned from.
            Null for an upload.
        grantedUserIds:
          nullable: true
          description: >-
            Who a restricted file is shared with. Shown only to the uploader and
            admins, and only on single-file responses; null everywhere else.
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - originalName
        - mimeType
        - sizeBytes
        - visibility
        - datasetId
        - version
        - isLatest
        - uploaderId
        - derivedFromFileId
        - grantedUserIds
        - createdAt
    UploadVersionBodyDoc:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileVersionPageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    ComparedFileDto:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        version:
          type: number
        originalName:
          type: string
      required:
        - fileId
        - version
        - originalName
    TypeChangeDto:
      type: object
      properties:
        column:
          type: string
        from:
          type: string
          enum: &ref_5
            - integer
            - number
            - boolean
            - date
            - string
            - empty
        to:
          type: string
          enum: *ref_5
      required:
        - column
        - from
        - to
    NullPercentChangeDto:
      type: object
      properties:
        column:
          type: string
        from:
          type: number
          description: Percent empty in `from`.
        to:
          type: number
          description: Percent empty in `to`.
        delta:
          type: number
          description: Percentage points; positive means more empty cells.
      required:
        - column
        - from
        - to
        - delta
    CountChangeDto:
      type: object
      properties:
        from:
          type: number
          nullable: true
        to:
          type: number
          nullable: true
        delta:
          type: number
          nullable: true
          description: '`to` minus `from`; null when either side has no value.'
      required:
        - from
        - to
        - delta
    ComparisonDto:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/ComparedFileDto'
        to:
          $ref: '#/components/schemas/ComparedFileDto'
        columnsAdded:
          description: >-
            In `to` but not in `from` (names ignore case; a renamed header is
            one removed and one added).
          type: array
          items:
            type: string
        columnsRemoved:
          description: In `from` but not in `to`.
          type: array
          items:
            type: string
        typeChanges:
          description: >-
            Columns whose dominant type changed. A column that is empty on
            either side has no type to compare.
          type: array
          items:
            $ref: '#/components/schemas/TypeChangeDto'
        nullPercentChanges:
          description: >-
            Columns whose share of empty cells moved by 5 percentage points or
            more.
          type: array
          items:
            $ref: '#/components/schemas/NullPercentChangeDto'
        rowCount:
          $ref: '#/components/schemas/CountChangeDto'
        columnCount:
          $ref: '#/components/schemas/CountChangeDto'
        duplicateRows:
          $ref: '#/components/schemas/CountChangeDto'
        qualityScore:
          description: The quality score; `delta` is null when either file was not scored.
          allOf:
            - $ref: '#/components/schemas/CountChangeDto'
        schemaChanged:
          type: boolean
          description: >-
            A column was removed or changed type — what breaks a reader of the
            data. New columns and shifts in blanks do not count.
      required:
        - from
        - to
        - columnsAdded
        - columnsRemoved
        - typeChanges
        - nullPercentChanges
        - rowCount
        - columnCount
        - duplicateRows
        - qualityScore
        - schemaChanged
    CursorMetaDto:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.
        hasMore:
          type: boolean
      required:
        - nextCursor
        - hasMore
    FilePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    FileDownloadDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            A short-lived link. Fetch it directly; it needs no Authorization
            header.
        expiresAt:
          type: string
          format: date-time
          description: The link stops working at this instant.
      required:
        - url
        - expiresAt
    SheetInfoDto:
      type: object
      properties:
        name:
          type: string
          description: The worksheet that was profiled.
        others:
          description: >-
            The other worksheets that have rows. They are stored with the file
            but not profiled; choose one with `POST /files/{id}/report/rebuild`.
          type: array
          items:
            type: string
      required:
        - name
        - others
    TypeCountsDto:
      type: object
      properties:
        integer:
          type: number
        number:
          type: number
        boolean:
          type: number
        date:
          type: number
        string:
          type: number
      required:
        - integer
        - number
        - boolean
        - date
        - string
    NumericStatsDto:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        mean:
          type: number
      required:
        - min
        - max
        - mean
    SensitiveDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - email
            - phone
            - card_number
            - iban
            - ip_address
            - secret
            - birth_date
          description: What the column looks like it holds.
        matchPercent:
          type: number
          description: >-
            Share of the column's checked, non-empty values that look like this,
            0–100.
      required:
        - kind
        - matchPercent
    ColumnMetricsDto:
      type: object
      properties:
        index:
          type: number
        name:
          type: string
        nullCount:
          type: number
          description: Blank and whitespace-only cells count as empty.
        nullPercent:
          type: number
          description: Percent of the column that is empty, 0–100, two decimals.
        inferredType:
          type: string
          enum: *ref_5
          description: The dominant kind of value in the column.
        typeCounts:
          $ref: '#/components/schemas/TypeCountsDto'
        inconsistent:
          type: boolean
          description: More than one kind of value in the column (numbers AND text, say).
        inconsistentPercent:
          type: number
          description: Percent of non-empty cells that disagree with the dominant type.
        numeric:
          nullable: true
          description: Over the numeric cells; null if there are none.
          type: object
          allOf:
            - $ref: '#/components/schemas/NumericStatsDto'
        sensitive:
          nullable: true
          description: >-
            Set when the column looks like it holds personal or secret data
            (found by patterns and checksums, never by a model). Only the kind
            and share are kept, never a value.
          type: object
          allOf:
            - $ref: '#/components/schemas/SensitiveDto'
      required:
        - index
        - name
        - nullCount
        - nullPercent
        - inferredType
        - typeCounts
        - inconsistent
        - inconsistentPercent
        - numeric
        - sensitive
    MetricsDto:
      type: object
      properties:
        rowCount:
          type: number
          description: Data rows profiled, header excluded.
        columnCount:
          type: number
        emptyRows:
          type: number
          description: Rows with no value in any column.
        duplicateRows:
          type: number
          description: Rows identical to an earlier row.
        raggedRows:
          type: number
          description: Rows with more or fewer cells than the header.
        truncated:
          type: boolean
          description: >-
            True when the file had more rows than the profile budget: the
            numbers cover the first `rowBudget` rows.
        rowBudget:
          type: number
        headerIssues:
          description: Problems with the header row (blank or repeated names).
          type: array
          items:
            type: string
        sheet:
          nullable: true
          description: Which worksheet of a workbook this report covers. Null for a CSV.
          type: object
          allOf:
            - $ref: '#/components/schemas/SheetInfoDto'
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMetricsDto'
      required:
        - rowCount
        - columnCount
        - emptyRows
        - duplicateRows
        - raggedRows
        - truncated
        - rowBudget
        - headerIssues
        - sheet
        - columns
    NarrativeDto:
      type: object
      properties:
        summary:
          type: string
        recommendations:
          type: array
          items:
            type: string
        model:
          type: string
          description: The model that wrote it.
      required:
        - summary
        - recommendations
        - model
    RuleResultDto:
      type: object
      properties:
        ruleId:
          type: string
          description: >-
            The rule this result is for (it may have been edited or deleted
            since).
        name:
          type: string
        kind:
          type: string
          enum: &ref_10
            - required_column
            - max_null_percent
            - type_is
            - min_value
            - max_value
            - unique
            - max_duplicate_rows
            - no_sensitive_data
        columnName:
          type: string
          nullable: true
        severity:
          type: string
          enum: &ref_11
            - error
            - warning
        status:
          type: string
          enum:
            - passed
            - failed
            - skipped
          description: >-
            `skipped`: the rule does not apply to this file (its column is not
            in it, or holds no numbers).
        message:
          type: string
          description: What was found and what was required, in words.
        params:
          type: object
          additionalProperties: true
          description: What the rule required when this report was built.
      required:
        - ruleId
        - name
        - kind
        - columnName
        - severity
        - status
        - message
        - params
    ReportDto:
      type: object
      properties:
        fileId:
          type: string
        status:
          type: string
          enum:
            - queued
            - profiling
            - ready
            - unsupported
            - failed
        metrics:
          nullable: true
          description: Present once `status` is `ready`.
          type: object
          allOf:
            - $ref: '#/components/schemas/MetricsDto'
        narrative:
          nullable: true
          description: >-
            The plain-language summary. Null when no AI provider is configured
            or it produced nothing usable; the metrics are unaffected.
          type: object
          allOf:
            - $ref: '#/components/schemas/NarrativeDto'
        errorMessage:
          type: string
          nullable: true
          description: Why the report is `failed` or `unsupported`.
        profiledAt:
          type: string
          format: date-time
          nullable: true
        qualityScore:
          type: number
          nullable: true
          description: >-
            How the file did against the company’s quality rules, 0–100: the
            share of applicable rules it passed, an `error` rule counting double
            a `warning`. Null when no rule applied (or none is defined).
        ruleResults:
          nullable: true
          description: >-
            One result per rule the company had when this report was built, each
            carrying the rule as it was then (rules can be edited later). Null
            when the company had no rules. Rebuild the report to check against
            today’s rules.
          type: array
          items:
            $ref: '#/components/schemas/RuleResultDto'
        sensitiveColumns:
          type: number
          description: >-
            How many columns look like they hold personal or secret data (see
            `metrics.columns[].sensitive`). 0 until the report is ready.
      required:
        - fileId
        - status
        - metrics
        - narrative
        - errorMessage
        - profiledAt
        - qualityScore
        - ruleResults
        - sensitiveColumns
    RebuildReportDto:
      type: object
      properties:
        sheet:
          type: string
          description: >-
            For a workbook with several worksheets: the one to profile. It must
            be one of the sheets the report names (`metrics.sheet`). Omit to
            keep the sheet already chosen.
          example: Sales
    PreviewColumnDto:
      type: object
      properties:
        name:
          type: string
        inferredType:
          type: string
          enum: *ref_5
      required:
        - name
        - inferredType
    PreviewDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/PreviewColumnDto'
        rows:
          type: array
          items:
            type: array
            items:
              nullable: true
              oneOf:
                - type: string
                - type: number
                - type: boolean
          description: >-
            The first rows, one array of cells per row in column order. Dates
            are ISO strings.
        totalRows:
          type: number
          description: Rows in the file (up to the profile budget).
        truncated:
          type: boolean
          description: True when `rows` is only the first part of the file.
      required:
        - columns
        - rows
        - totalRows
        - truncated
    UpdateFileDto:
      type: object
      properties:
        visibility:
          type: string
          enum: *ref_4
        grantedUserIds:
          description: >-
            REPLACES the set of colleagues granted access. Only meaningful for a
            `restricted` file; switching to `company` clears it.
          type: array
          items:
            type: string
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    CleanPreviewDto:
      type: object
      properties:
        recipe:
          type: object
          additionalProperties: true
          description: >-
            The steps, in order: `{ "steps": [ { "step": "trim_whitespace" }, {
            "step": "standardise_dates", "column": "when", "order": "dmy" } ]
            }`. Steps: `trim_whitespace`, `tidy_headers`, `drop_empty_rows`,
            `drop_duplicate_rows`, `standardise_dates`, `parse_numbers`,
            `replace_values`, `fill_empty`, `change_case`, `rename_column`,
            `drop_column`, `mask_column`. A step about a column the file does
            not have is skipped, not refused.
        sheet:
          type: string
          description: >-
            For a workbook with several sheets: the one to clean. Omit for the
            sheet the report covers.
          example: Sales
      required:
        - recipe
    StepOutcomeDto:
      type: object
      properties:
        step:
          type: string
          enum:
            - trim_whitespace
            - tidy_headers
            - drop_empty_rows
            - drop_duplicate_rows
            - standardise_dates
            - parse_numbers
            - replace_values
            - fill_empty
            - change_case
            - rename_column
            - drop_column
            - mask_column
        label:
          type: string
          description: The step in words, e.g. "Trim spaces in Name".
        changed:
          type: number
          description: >-
            Cells changed (or rows or columns removed, for the steps that do
            that).
        skipped:
          type: string
          nullable: true
          description: Why the step did nothing, when it did not apply.
        notes:
          description: Things worth saying, e.g. values that could not be read as dates.
          type: array
          items:
            type: string
      required:
        - step
        - label
        - changed
        - skipped
        - notes
    SampleCellDto:
      type: object
      properties:
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
        - before
        - after
    SampleRowDto:
      type: object
      properties:
        row:
          type: number
          description: >-
            The row's number in the file as uploaded, counting the header as row
            1.
        cells:
          description: One per column of the cleaned file, in order.
          type: array
          items:
            $ref: '#/components/schemas/SampleCellDto'
      required:
        - row
        - cells
    CleanPreviewResultDto:
      type: object
      properties:
        rowsBefore:
          type: number
        rowsAfter:
          type: number
        columns:
          description: The columns the cleaned file would have.
          type: array
          items:
            type: string
        steps:
          description: What each step did, counted over the WHOLE file.
          type: array
          items:
            $ref: '#/components/schemas/StepOutcomeDto'
        samples:
          description: The first rows the steps change, each cell before and after.
          type: array
          items:
            $ref: '#/components/schemas/SampleRowDto'
      required:
        - rowsBefore
        - rowsAfter
        - columns
        - steps
        - samples
    CleanFileDto:
      type: object
      properties:
        recipe:
          type: object
          additionalProperties: true
          description: >-
            The steps, in order: `{ "steps": [ { "step": "trim_whitespace" }, {
            "step": "standardise_dates", "column": "when", "order": "dmy" } ]
            }`. Steps: `trim_whitespace`, `tidy_headers`, `drop_empty_rows`,
            `drop_duplicate_rows`, `standardise_dates`, `parse_numbers`,
            `replace_values`, `fill_empty`, `change_case`, `rename_column`,
            `drop_column`, `mask_column`. A step about a column the file does
            not have is skipped, not refused.
        sheet:
          type: string
          description: >-
            For a workbook with several sheets: the one to clean. Omit for the
            sheet the report covers.
          example: Sales
        saveRecipe:
          type: boolean
          description: >-
            Keep this recipe for the file (its dataset), so it is offered again
            next time.
          default: false
        autoClean:
          type: boolean
          description: >-
            Clean every NEW version of this dataset with this recipe, keeping
            each upload as it arrived and adding the cleaned data after it.
            Needs `saveRecipe`, and a Basic or Premium plan.
          default: false
      required:
        - recipe
    CleaningJobDto:
      type: object
      properties:
        id:
          type: string
        fileId:
          type: string
        status:
          type: string
          enum:
            - queued
            - running
            - succeeded
            - failed
        trigger:
          type: string
          enum:
            - manual
            - auto
          description: >-
            `auto` when a dataset's "clean every new version" setting started
            it.
        resultFileId:
          type: string
          nullable: true
          description: The new version, once it exists.
        errorMessage:
          type: string
          nullable: true
        steps:
          description: What each step did; empty until the job has run.
          type: array
          items:
            $ref: '#/components/schemas/StepOutcomeDto'
        rowsBefore:
          type: number
          nullable: true
        rowsAfter:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - fileId
        - status
        - trigger
        - resultFileId
        - errorMessage
        - steps
        - rowsBefore
        - rowsAfter
        - createdAt
    DatasetSettingsDto:
      type: object
      properties:
        datasetId:
          type: string
        keyColumns:
          description: >-
            The columns that together identify a row, for comparing two versions
            row by row.
          type: array
          items:
            type: string
        recipe:
          type: object
          additionalProperties: true
          nullable: true
          description: The saved cleaning recipe, or null.
        autoClean:
          type: boolean
          description: Every new version is cleaned with the saved recipe.
        autoCleanAvailable:
          type: boolean
          description: Whether this company's plan includes automatic cleaning.
      required:
        - datasetId
        - keyColumns
        - recipe
        - autoClean
        - autoCleanAvailable
    UpdateDatasetSettingsDto:
      type: object
      properties:
        keyColumns:
          description: REPLACES the key columns.
          type: array
          items:
            type: string
        recipe:
          type: object
          additionalProperties: true
          nullable: true
          description: >-
            The cleaning recipe to keep; `null` removes it (and switches
            automatic cleaning off).
        autoClean:
          type: boolean
          description: >-
            Clean every new version automatically. Needs a saved recipe, and a
            Basic or Premium plan.
    RowDiffVersionDto:
      type: object
      properties:
        fileId:
          type: string
          format: uuid
        version:
          type: number
        originalName:
          type: string
      required:
        - fileId
        - version
        - originalName
    ColumnChangeCountDto:
      type: object
      properties:
        column:
          type: string
        changed:
          type: number
      required:
        - column
        - changed
    RowDiffSummaryDto:
      type: object
      properties:
        keyColumns:
          type: array
          items:
            type: string
        rowsBefore:
          type: number
        rowsAfter:
          type: number
        added:
          type: number
        removed:
          type: number
        changed:
          type: number
        unchanged:
          type: number
        unmatchable:
          type: number
          description: >-
            Rows with an empty key, or a key that appears more than once, in
            either version. They cannot be matched and are not counted above.
        columnsChanged:
          description: >-
            Columns in both versions, with how many rows changed in each, most
            first.
          type: array
          items:
            $ref: '#/components/schemas/ColumnChangeCountDto'
        columnsAdded:
          type: array
          items:
            type: string
        columnsRemoved:
          type: array
          items:
            type: string
      required:
        - keyColumns
        - rowsBefore
        - rowsAfter
        - added
        - removed
        - changed
        - unchanged
        - unmatchable
        - columnsChanged
        - columnsAdded
        - columnsRemoved
    ChangedCellDto:
      type: object
      properties:
        column:
          type: string
        before:
          type: string
          nullable: true
        after:
          type: string
          nullable: true
      required:
        - column
        - before
        - after
    RowChangeDto:
      type: object
      properties:
        change:
          type: string
          enum:
            - added
            - removed
            - changed
        key:
          description: The values of the key columns, in the order of `keyColumns`.
          type: array
          items:
            type: string
        cells:
          description: >-
            For a changed row only the cells that differ; for an added or
            removed row every cell.
          type: array
          items:
            $ref: '#/components/schemas/ChangedCellDto'
      required:
        - change
        - key
        - cells
    RowDiffDto:
      type: object
      properties:
        from:
          $ref: '#/components/schemas/RowDiffVersionDto'
        to:
          $ref: '#/components/schemas/RowDiffVersionDto'
        status:
          type: string
          enum:
            - queued
            - running
            - ready
            - failed
            - none
          description: >-
            `none` until a comparison has been asked for (or made
            automatically).
        keyColumns:
          description: >-
            The columns the comparison used or, before one is made, those saved
            for the dataset.
          type: array
          items:
            type: string
        suggestedKeyColumns:
          description: >-
            Columns whose names say they identify a row, found in both versions:
            a suggestion to confirm.
          type: array
          items:
            type: string
        summary:
          nullable: true
          type: object
          allOf:
            - $ref: '#/components/schemas/RowDiffSummaryDto'
        sample:
          description: >-
            The first 500 changes: rows removed, then added, then changed. All
            of them are in the CSV.
          type: array
          items:
            $ref: '#/components/schemas/RowChangeDto'
        errorMessage:
          type: string
          nullable: true
          description: Why a comparison could not be made.
      required:
        - from
        - to
        - status
        - keyColumns
        - suggestedKeyColumns
        - summary
        - sample
        - errorMessage
    RowDiffRequestDto:
      type: object
      properties:
        keyColumns:
          description: >-
            The columns that together identify a row (up to 10), so a row in one
            version can be matched with the same row in the other. Omit to use
            the ones saved for the dataset (`PUT
            /datasets/{datasetId}/settings`).
          example:
            - customer_id
          type: array
          items:
            type: string
    ExploreRequestDto:
      type: object
      properties:
        query:
          type: object
          additionalProperties: true
          description: >-
            A query: `filters` (each `{ column, op, value }`; `op` is `equals`,
            `contains`, `greater`, `less`, `empty` or `not_empty`), `groupBy`
            (up to 2 columns), `measures` (1 to 4 of `{ fn, column }`; `fn` is
            `count`, `sum`, `average`, `min`, `max` or `distinct`; `count` takes
            no column), an optional `sort` (`{ by: "group" | "measure", index,
            direction: "asc" | "desc" }`) and a `limit` (1 to 200, default 50).
            Example: `{ "groupBy": ["region"], "measures": [{ "fn": "sum",
            "column": "revenue" }], "sort": { "by": "measure", "index": 0,
            "direction": "desc" } }`.
      required:
        - query
    ResultColumnDto:
      type: object
      properties:
        name:
          type: string
        kind:
          type: string
          enum:
            - group
            - measure
      required:
        - name
        - kind
    QueryResultDto:
      type: object
      properties:
        columns:
          description: The group-by columns first, then one column per measure.
          type: array
          items:
            $ref: '#/components/schemas/ResultColumnDto'
        rows:
          type: array
          items:
            type: array
            items:
              oneOf:
                - type: string
                - type: number
              nullable: true
          description: >-
            One row per group (one row in all when there is no `groupBy`), cells
            in the order of `columns`. A measure that has nothing to work on is
            null.
        rowsMatched:
          type: number
          description: Rows that passed the filters.
        rowsScanned:
          type: number
          description: Rows in the file.
        groupCount:
          type: number
          description: How many groups there were before `limit` cut the list.
        notes:
          description: >-
            Things worth saying, such as cells that were not numbers and were
            left out.
          type: array
          items:
            type: string
      required:
        - columns
        - rows
        - rowsMatched
        - rowsScanned
        - groupCount
        - notes
    AskRequestDto:
      type: object
      properties:
        question:
          type: string
          description: >-
            A question about the file, in words. The assistant is shown it and
            the column names and types, never a value.
          example: Total revenue by region, highest first
      required:
        - question
    AskResultDto:
      type: object
      properties:
        question:
          type: string
        spec:
          type: object
          additionalProperties: true
          description: >-
            The query the assistant planned, validated and run by the server. A
            query: `filters` (each `{ column, op, value }`; `op` is `equals`,
            `contains`, `greater`, `less`, `empty` or `not_empty`), `groupBy`
            (up to 2 columns), `measures` (1 to 4 of `{ fn, column }`; `fn` is
            `count`, `sum`, `average`, `min`, `max` or `distinct`; `count` takes
            no column), an optional `sort` (`{ by: "group" | "measure", index,
            direction: "asc" | "desc" }`) and a `limit` (1 to 200, default 50).
            Example: `{ "groupBy": ["region"], "measures": [{ "fn": "sum",
            "column": "revenue" }], "sort": { "by": "measure", "index": 0,
            "direction": "desc" } }`.
        result:
          $ref: '#/components/schemas/QueryResultDto'
        model:
          type: string
          nullable: true
          description: The model that planned the query.
        questionsUsed:
          type: number
          description: Questions answered so far this billing period, this one included.
        questionsLimit:
          type: number
          description: Questions the plan answers a billing period.
      required:
        - question
        - spec
        - result
        - model
        - questionsUsed
        - questionsLimit
    AllowanceDto:
      type: object
      properties:
        aiAvailable:
          type: boolean
          description: >-
            False when the AI assistant is switched off on this server: the
            query builder still works.
        questionsUsed:
          type: number
        questionsLimit:
          type: number
      required:
        - aiAvailable
        - questionsUsed
        - questionsLimit
    BillingPeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: 'Exclusive, UTC midnight: when the next period starts.'
        days:
          type: number
      required:
        - start
        - end
        - days
    LineItemDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - seat
            - plan_base
            - overage
        description:
          type: string
          example: Employee seat
        unitCents:
          type: number
          description: The full price this line is a fraction of, in cents.
        amountCents:
          type: number
          description: What this line costs, in integer cents.
        userId:
          type: string
          description: 'seat: the employee this seat is for.'
        activeDays:
          type: number
          description: 'seat: days the employee was active in the period.'
        billedDays:
          type: number
          description: 'plan_base: days the plan was billed.'
        periodDays:
          type: number
          description: 'seat / plan_base: days in the whole period.'
        files:
          type: number
          description: 'overage: files beyond the plan’s included quota.'
      required:
        - kind
        - description
        - unitCents
        - amountCents
    StatementDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_6
            - free
            - basic
            - premium
        period:
          $ref: '#/components/schemas/BillingPeriodDto'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: >-
            What the invoice will be if nothing changes: employees active now
            are assumed to stay active to the end of the period, and files count
            as uploaded so far. Integer cents.
        seats:
          type: number
          description: 'Seats in use right now: the admin plus every active employee.'
        filesThisPeriod:
          type: number
          description: Files uploaded so far this period.
        dueDate:
          type: string
          format: date-time
          description: When the period ends and the invoice is finalized.
        asOf:
          type: string
          format: date-time
          description: When this statement was computed.
      required:
        - plan
        - period
        - lineItems
        - totalCents
        - seats
        - filesThisPeriod
        - dueDate
        - asOf
    InvoiceDto:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
          enum: *ref_6
          description: The plan that was live during the billed period.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
          description: >-
            Exclusive. Earlier than the period end when a plan change closed the
            period early.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: Integer cents.
        status:
          type: string
          enum:
            - finalized
            - draft
            - open
            - paid
            - uncollectible
            - void
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        provider:
          type: string
          enum:
            - local
            - stripe
        stripeHostedInvoiceUrl:
          type: object
          nullable: true
        stripeInvoicePdfUrl:
          type: object
          nullable: true
        currency:
          type: object
          nullable: true
        paymentAttempts:
          type: number
        paidAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - plan
        - periodStart
        - periodEnd
        - lineItems
        - totalCents
        - status
        - dueDate
        - createdAt
        - provider
        - paymentAttempts
    InvoicePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    PortalSessionDto:
      type: object
      properties:
        url:
          type: string
          format: uri
      required:
        - url
    NotificationDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - quota.threshold
            - report.ready
            - report.failed
            - rules.failed
            - file.sensitive_data
            - dataset.schema_changed
            - file.cleaned
            - cleaning.failed
            - dataset.changed
            - file.shared
            - invoice.finalized
            - comment.mentioned
          description: What happened. Decides the shape of `payload`.
        payload:
          type: object
          additionalProperties: true
          description: >-
            Ids, counts and names for this `type` — never cell values. For
