        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
        - rateLimitPerMinute
        - maxQualityRules
        - maxVersionsPerDataset
        - questionsPerPeriod
    PeriodDto:
      type: object
