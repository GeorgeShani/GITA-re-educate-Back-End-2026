        maxQualityRules:
          type: number
          nullable: true
          description: >-
            Data-quality rules the company may keep, enabled or not; null =
            unlimited.
        maxVersionsPerDataset:
          type: number
          nullable: true
          description: >-
            Versions one file may hold (an uploaded version counts toward the
            file quota, a cleaned one does not); null = unlimited.
        questionsPerPeriod:
          type: number
          description: >-
            Plain-language questions the AI assistant may answer about your
            files per billing period. The query builder is not counted.
