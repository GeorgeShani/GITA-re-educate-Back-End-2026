openapi: 3.0.0
paths:
  /auth/register-company:
    post:
      operationId: AuthController_registerCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCompanyResponseDto'
      tags: &ref_0
        - auth
      summary: Register a company
      description: >-
        Creates the company (`pending_activation`), its first admin (`invited`)
        and their password identity in one transaction, then emails an
        activation link valid for 24 hours. The admin cannot sign in until the
        link is used. The form has no name field, so `fullName` starts as the
        local part of the email; change it with `PATCH /users/me`. A password
        sign-in email identifies exactly one account, so an address already
        registered returns 409.
  /auth/activate:
    get:
      operationId: AuthController_activate
      parameters:
        - name: token
          required: true
          in: query
          description: The single-use token from the emailed link.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Activate a company
      description: >-
        Spends the single-use token from the activation email and turns the
        company and its admin `active`. An expired, unknown or already-used
        token returns 400 — request a fresh one with `POST
        /auth/resend-activation`.
  /auth/resend-activation:
    post:
      operationId: AuthController_resendActivation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Resend the activation email
      description: >-
        Issues a fresh activation link and invalidates the previous one. Always
        answers 200 with the same message, whether or not the address is
        registered, so it cannot be used to discover accounts.
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_0
      summary: Sign in with email and password
      description: >-
        Returns a 15-minute access token and a 30-day, single-use refresh token.
        Refused with 403 while the company or the user is not yet active, and
        with 401 for a wrong email or password (the two are indistinguishable).
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_0
      summary: Exchange a refresh token for a new session
      description: >-
        Rotates the refresh token: the one presented is spent and a new pair is
        returned. Presenting an already-spent token means it was copied, so
        every session descended from that login is revoked and both holders must
        sign in again.
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Sign out
      description: >-
        Revokes the session the refresh token belongs to. Public, because the
        access token has usually expired by the time someone signs out. Always
        answers 200.
  /auth/password/forgot:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Request a password reset email
      description: >-
        Emails a reset link valid for one hour to an active account. Always
        answers 200 with the same message, whether or not the address is
        registered.
  /auth/password/reset:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Reset a forgotten password
      description: >-
        Sets a new password using the emailed token and signs the account out of
        every device. The token is single-use.
  /auth/password:
    patch:
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Change your password
      description: >-
        Requires the current password. Signs out every session, including this
        one, and returns a fresh session so the calling device stays signed in.
        A confirmation email is sent.
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Get the signed-in user and their company
      description: >-
        The caller's own user record and company. Role and status come from the
        database on every request, not from the token, so a change of role or a
        disabled account is reflected immediately.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_1
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum:
            - admin
            - employee
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_1
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - fullName
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_1
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_2
            - free
            - basic
            - premium
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_2
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
