openapi: 3.0.0
paths:
  /auth/register-company:
    post:
      operationId: AuthController_registerCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCompanyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterCompanyResponseDto'
      tags: &ref_0
        - auth
      summary: Register a company
      description: >-
        Creates the company (`pending_activation`), its first admin (`invited`)
        and their password identity in one transaction, then emails an
        activation link valid for 24 hours. The admin cannot sign in until the
        link is used. The form has no name field, so `fullName` starts as the
        local part of the email; change it with `PATCH /users/me`. A password
        sign-in email identifies exactly one account, so an address already
        registered returns 409.
  /auth/activate:
    get:
      operationId: AuthController_activate
      parameters:
        - name: token
          required: true
          in: query
          description: The single-use token from the emailed link.
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Activate a company
      description: >-
        Spends the single-use token from the activation email and turns the
        company and its admin `active`. An expired, unknown or already-used
        token returns 400 — request a fresh one with `POST
        /auth/resend-activation`.
  /auth/resend-activation:
    post:
      operationId: AuthController_resendActivation
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Resend the activation email
      description: >-
        Issues a fresh activation link and invalidates the previous one. Always
        answers 200 with the same message, whether or not the address is
        registered, so it cannot be used to discover accounts.
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_0
      summary: Sign in with email and password
      description: >-
        Returns a 15-minute access token and a 30-day, single-use refresh token.
        Refused with 403 while the company or the user is not yet active, and
        with 401 for a wrong email or password (the two are indistinguishable).
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_0
      summary: Exchange a refresh token for a new session
      description: >-
        Rotates the refresh token: the one presented is spent and a new pair is
        returned. Presenting an already-spent token means it was copied, so
        every session descended from that login is revoked and both holders must
        sign in again.
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Sign out
      description: >-
        Revokes the session the refresh token belongs to. Public, because the
        access token has usually expired by the time someone signs out. Always
        answers 200.
  /auth/password/forgot:
    post:
      operationId: AuthController_forgotPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Request a password reset email
      description: >-
        Emails a reset link valid for one hour to an active account. Always
        answers 200 with the same message, whether or not the address is
        registered.
  /auth/password/reset:
    post:
      operationId: AuthController_resetPassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      tags: *ref_0
      summary: Reset a forgotten password
      description: >-
        Sets a new password using the emailed token and signs the account out of
        every device. The token is single-use.
  /auth/accept-invite:
    post:
      operationId: AuthController_acceptInvite
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_0
      summary: Accept an invitation
      description: >-
        Spends the single-use token from an invitation email, sets the
        employee's password, activates them and signs them in — returning the
        same session as login. The link itself proves who they are, so nothing
        compares email addresses. Billing for their seat starts now, not when
        they were invited. An unknown, expired, used or superseded link returns
        400.
  /auth/password:
    patch:
      operationId: AuthController_changePassword
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Change your password
      description: >-
        Requires the current password. Signs out every session, including this
        one, and returns a fresh session so the calling device stays signed in.
        A confirmation email is sent.
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeDto'
      security:
        - bearer: []
      tags: *ref_0
      summary: Get the signed-in user and their company
      description: >-
        The caller's own user record and company. Role and status come from the
        database on every request, not from the token, so a change of role or a
        disabled account is reflected immediately.
  /auth/oauth/google/url:
    post:
      operationId: OAuthController_googleUrl
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleUrlDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlDto'
      tags: &ref_1
        - auth
      summary: Start signing in, registering or accepting an invite with Google
      description: >-
        Returns the Google authorization URL to send the browser to, and sets an
        httpOnly `gl_oauth_nonce` cookie that pins the flow to this browser —
        the callback refuses to continue without it, which is what stops a
        victim being signed into an attacker's account. Call it from the
        browser, or forward the `Set-Cookie` if a server makes the call. `login`
        and `register` behave identically: a Google account already known signs
        in, an unknown one is offered company registration. `invite` needs the
        `inviteToken` from the invitation email and binds the Google account to
        the invited user, with no email comparison. A dead invite is refused
        here with 400, before any trip to Google. Answers 503 when Google
        sign-in is not configured; password auth is unaffected.
  /auth/google/callback:
    get:
      operationId: OAuthController_googleCallback
      parameters:
        - name: error
          required: false
          in: query
          schema: {}
        - name: state
          required: false
          in: query
          schema: {}
        - name: code
          required: false
          in: query
          schema: {}
      responses:
        '302':
          description: Redirects the browser to the web app.
      tags: *ref_1
      summary: Google redirects the browser back here
      description: >-
        Not called by API clients: Google navigates the browser to it, and it
        always answers with a redirect to the web app — never JSON, because a
        person is looking at the page. Success redirects to
        `/session/oauth-complete?code=…`, where `code` is a single-use,
        60-second value to trade at `POST /auth/oauth/exchange`; no token ever
        appears in a URL. An unknown Google account redirects to
        `/register?oauthRegistration=…`. A linking flow redirects to
        `/settings/linked-accounts?linked=google`. Any refusal redirects with
        `?error=` set to one of `invalid_state`, `access_denied`,
        `provider_error`, `invalid_invite`, `identity_in_use`, `already_linked`,
        `not_activated`, `account_unavailable` or `ambiguous_email`. A known
        `(google, sub)` signs in whatever email Google now reports. An unknown
        one is linked to an existing user only when Google verified the address,
        it is not a relay/alias address, and it exactly matches one active
        user's contact address.
  /auth/oauth/exchange:
    post:
      operationId: OAuthController_exchange
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthExchangeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionDto'
      tags: *ref_1
      summary: Trade the callback's code for a session
      description: >-
        Called by the web app's server after the redirect to
        `/session/oauth-complete`. The code is single-use and expires after 60
        seconds; the account is re-checked at this moment, so someone disabled
        in the meantime gets 401. Returns the same session as login.
  /auth/oauth/registration/preview:
    post:
      operationId: OAuthController_registrationPreview
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRegistrationTokenDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRegistrationPreviewDto'
      tags: *ref_1
      summary: Read what a Google registration token prefills
      description: >-
        Decodes the `oauthRegistration` token from the redirect to `/register`
        into what the form should prefill. `email` is null when Google reported
        a relay or alias address — the person must supply a real one.
        `emailVerified` says whether Google vouches for it, which decides
        whether registration skips the activation email.
  /auth/oauth/register-company:
    post:
      operationId: OAuthController_registerCompany
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthRegisterCompanyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthRegisterCompanyResponseDto'
      tags: *ref_1
      summary: Register a company with a Google account
      description: >-
        The same form as `POST /auth/register-company` minus the password
        (Google is the credential), plus the `oauthRegistration` token. When
        Google vouches for the address it becomes the contact address, the
        company is active at once, no activation email is sent, and the response
        carries a session. Otherwise `email` is required and the flow is a
        password registration's: an activation email is sent and no session is
        returned. The token is valid for 15 minutes. Returns 409 when the
        company address or the Google account is already registered.
  /auth/identities/google/link:
    post:
      operationId: OAuthController_linkGoogle
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthUrlDto'
      security:
        - bearer: []
      tags: *ref_1
      summary: Start linking a Google account to the signed-in user
      description: >-
        "Settings → Linked accounts." Returns the Google URL and sets the same
        flow cookie as `POST /auth/oauth/google/url`. When the callback returns,
        the Google account is bound to the signed-in user with no email
        comparison at all — a relay address, a personal Gmail and an unrelated
        one all work. A Google account that already belongs to someone else, or
        a user who already has a different one, is refused with `?error=`.
  /auth/identities:
    get:
      operationId: OAuthController_listIdentities
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentityListDto'
      security:
        - bearer: []
      tags: *ref_1
      summary: List your sign-in methods
      description: >-
        The caller's own identities — password and/or Google — with the address
        each provider reports, which may differ from the work address forever.
        Never returns a hash or the provider's subject.
  /auth/identities/{id}:
    delete:
      operationId: OAuthController_unlinkIdentity
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponseDto'
      security:
        - bearer: []
      tags: *ref_1
      summary: Remove a sign-in method
      description: >-
        Removes one of the caller's own identities. Returns 409 when it is the
        only one left — a user with no way to sign in cannot be helped by anyone
        but a DBA. Someone else's identity is a 404.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadFileBodyDoc:
      type: object
      properties:
        visibility:
          type: string
          enum: &ref_2
            - company
            - restricted
          default: company
        grantedUserIds:
          description: >-
            With `restricted`: the colleagues who may also see the file (the
            uploader and admins always can). Repeat the field, or send a JSON
            array. Empty means the uploader and admins only.
          type: array
          items:
            type: string
        file:
          type: string
          format: binary
          description: A CSV, XLS or XLSX file, up to 25 MB.
      required:
        - file
    FileDto:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
          description: From the file's bytes, not from what the client claimed.
        sizeBytes:
          type: number
        visibility:
          type: string
          enum: *ref_2
        uploaderId:
          type: string
        grantedUserIds:
          nullable: true
          description: >-
            Who a restricted file is shared with. Shown only to the uploader and
            admins, and only on single-file responses; null everywhere else.
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - originalName
        - mimeType
        - sizeBytes
        - visibility
        - uploaderId
        - grantedUserIds
        - createdAt
    CursorMetaDto:
      type: object
      properties:
        nextCursor:
          type: string
          nullable: true
          description: Pass as `cursor` to get the next page; null on the last page.
        hasMore:
          type: boolean
      required:
        - nextCursor
        - hasMore
    FilePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FileDto'
        meta:
          $ref: '#/components/schemas/CursorMetaDto'
      required:
        - data
        - meta
    FileDownloadDto:
      type: object
      properties:
        url:
          type: string
          description: >-
            A short-lived link. Fetch it directly; it needs no Authorization
            header.
        expiresAt:
          type: string
          format: date-time
          description: The link stops working at this instant.
      required:
        - url
        - expiresAt
    TypeCountsDto:
      type: object
      properties:
        integer:
          type: number
        number:
          type: number
        boolean:
          type: number
        date:
          type: number
        string:
          type: number
      required:
        - integer
        - number
        - boolean
        - date
        - string
    NumericStatsDto:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        mean:
          type: number
      required:
        - min
        - max
        - mean
    ColumnMetricsDto:
      type: object
      properties:
        index:
          type: number
        name:
          type: string
        nullCount:
          type: number
          description: Blank and whitespace-only cells count as empty.
        nullPercent:
          type: number
          description: Percent of the column that is empty, 0–100, two decimals.
        inferredType:
          type: string
          enum: &ref_3
            - integer
            - number
            - boolean
            - date
            - string
            - empty
          description: The dominant kind of value in the column.
        typeCounts:
          $ref: '#/components/schemas/TypeCountsDto'
        inconsistent:
          type: boolean
          description: More than one kind of value in the column (numbers AND text, say).
        inconsistentPercent:
          type: number
          description: Percent of non-empty cells that disagree with the dominant type.
        numeric:
          nullable: true
          description: Over the numeric cells; null if there are none.
          type: object
          allOf:
            - $ref: '#/components/schemas/NumericStatsDto'
      required:
        - index
        - name
        - nullCount
        - nullPercent
        - inferredType
        - typeCounts
        - inconsistent
        - inconsistentPercent
        - numeric
    MetricsDto:
      type: object
      properties:
        rowCount:
          type: number
          description: Data rows profiled, header excluded.
        columnCount:
          type: number
        emptyRows:
          type: number
          description: Rows with no value in any column.
        duplicateRows:
          type: number
          description: Rows identical to an earlier row.
        raggedRows:
          type: number
          description: Rows with more or fewer cells than the header.
        truncated:
          type: boolean
          description: >-
            True when the file had more rows than the profile budget: the
            numbers cover the first `rowBudget` rows.
        rowBudget:
          type: number
        headerIssues:
          description: Problems with the header row (blank or repeated names).
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/ColumnMetricsDto'
      required:
        - rowCount
        - columnCount
        - emptyRows
        - duplicateRows
        - raggedRows
        - truncated
        - rowBudget
        - headerIssues
        - columns
    NarrativeDto:
      type: object
      properties:
        summary:
          type: string
        recommendations:
          type: array
          items:
            type: string
        model:
          type: string
          description: The model that wrote it.
      required:
        - summary
        - recommendations
        - model
    ReportDto:
      type: object
      properties:
        fileId:
          type: string
        status:
          type: string
          enum:
            - queued
            - profiling
            - ready
            - unsupported
            - failed
        metrics:
          nullable: true
          description: Present once `status` is `ready`.
          type: object
          allOf:
            - $ref: '#/components/schemas/MetricsDto'
        narrative:
          nullable: true
          description: >-
            The plain-language summary. Null when no AI provider is configured
            or it produced nothing usable; the metrics are unaffected.
          type: object
          allOf:
            - $ref: '#/components/schemas/NarrativeDto'
        errorMessage:
          type: string
          nullable: true
          description: Why the report is `failed` or `unsupported`.
        profiledAt:
          type: string
          format: date-time
          nullable: true
      required:
        - fileId
        - status
        - metrics
        - narrative
        - errorMessage
        - profiledAt
    PreviewColumnDto:
      type: object
      properties:
        name:
          type: string
        inferredType:
          type: string
          enum: *ref_3
      required:
        - name
        - inferredType
    PreviewDto:
      type: object
      properties:
        columns:
          type: array
          items:
            $ref: '#/components/schemas/PreviewColumnDto'
        rows:
          type: array
          items:
            type: array
            items:
              nullable: true
              oneOf:
                - type: string
                - type: number
                - type: boolean
          description: >-
            The first rows, one array of cells per row in column order. Dates
            are ISO strings.
        totalRows:
          type: number
          description: Rows in the file (up to the profile budget).
        truncated:
          type: boolean
          description: True when `rows` is only the first part of the file.
      required:
        - columns
        - rows
        - totalRows
        - truncated
    UpdateFileDto:
      type: object
      properties:
        visibility:
          type: string
          enum: *ref_2
        grantedUserIds:
          description: >-
            REPLACES the set of colleagues granted access. Only meaningful for a
            `restricted` file; switching to `company` clears it.
          type: array
          items:
            type: string
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    BillingPeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: 'Exclusive, UTC midnight: when the next period starts.'
        days:
          type: number
      required:
        - start
        - end
        - days
    LineItemDto:
      type: object
      properties:
        kind:
          type: string
          enum:
            - seat
            - plan_base
            - overage
        description:
          type: string
          example: Employee seat
        unitCents:
          type: number
          description: The full price this line is a fraction of, in cents.
        amountCents:
          type: number
          description: What this line costs, in integer cents.
        userId:
          type: string
          description: 'seat: the employee this seat is for.'
        activeDays:
          type: number
          description: 'seat: days the employee was active in the period.'
        billedDays:
          type: number
          description: 'plan_base: days the plan was billed.'
        periodDays:
          type: number
          description: 'seat / plan_base: days in the whole period.'
        files:
          type: number
          description: 'overage: files beyond the plan’s included quota.'
      required:
        - kind
        - description
        - unitCents
        - amountCents
    StatementDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_4
            - free
            - basic
            - premium
        period:
          $ref: '#/components/schemas/BillingPeriodDto'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: >-
            What the invoice will be if nothing changes: employees active now
            are assumed to stay active to the end of the period, and files count
            as uploaded so far. Integer cents.
        seats:
          type: number
          description: 'Seats in use right now: the admin plus every active employee.'
        filesThisPeriod:
          type: number
          description: Files uploaded so far this period.
        dueDate:
          type: string
          format: date-time
          description: When the period ends and the invoice is finalized.
        asOf:
          type: string
          format: date-time
          description: When this statement was computed.
      required:
        - plan
        - period
        - lineItems
        - totalCents
        - seats
        - filesThisPeriod
        - dueDate
        - asOf
    InvoiceDto:
      type: object
      properties:
        id:
          type: string
        plan:
          type: string
          enum: *ref_4
          description: The plan that was live during the billed period.
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
          description: >-
            Exclusive. Earlier than the period end when a plan change closed the
            period early.
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItemDto'
        totalCents:
          type: number
          description: Integer cents.
        status:
          type: string
          enum:
            - finalized
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - plan
        - periodStart
        - periodEnd
        - lineItems
        - totalCents
        - status
        - dueDate
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    InvoicePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_4
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_4
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_4
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_4
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_5
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AcceptInviteDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the invitation email.
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum: &ref_6
            - admin
            - employee
        status:
          type: string
          enum: &ref_7
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_5
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    GoogleUrlDto:
      type: object
      properties:
        intent:
          type: string
          enum:
            - login
            - register
            - invite
          description: >-
            `login` and `register` behave identically (a known Google account
            signs in, an unknown one is offered company registration); the value
            is for the frontend. `invite` binds the Google account to the
            invited user.
        inviteToken:
          type: string
          description: 'Required for `invite`: the token from the invitation email.'
      required:
        - intent
    OAuthUrlDto:
      type: object
      properties:
        url:
          type: string
          description: Send the browser here. Google sends it back to the API callback.
      required:
        - url
    OAuthExchangeDto:
      type: object
      properties:
        code:
          type: string
          description: >-
            The single-use `code` from the redirect to
            `/session/oauth-complete`. Valid for 60 seconds.
      required:
        - code
    OAuthRegistrationTokenDto:
      type: object
      properties:
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
      required:
        - oauthRegistrationToken
    OAuthRegistrationPreviewDto:
      type: object
      properties:
        email:
          type: string
          nullable: true
          description: >-
            The address to prefill, or null when Google reported a relay/alias
            address (ask the person for one).
        emailVerified:
          type: boolean
          description: >-
            True when Google vouches for `email`; registration then needs no
            activation email.
        name:
          type: string
          nullable: true
      required:
        - email
        - emailVerified
        - name
    OAuthRegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_5
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - companyName
        - country
        - industry
        - oauthRegistrationToken
    OAuthRegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum:
            - pending_activation
            - active
        message:
          type: string
        session:
          nullable: true
          description: >-
            Present when Google vouched for the address, so the company is
            active at once and the person is signed in.
          type: object
          allOf:
            - $ref: '#/components/schemas/SessionDto'
      required:
        - companyId
        - userId
        - status
        - message
    IdentityDto:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
          enum:
            - password
            - google
        email:
          type: string
          nullable: true
          description: >-
            The address as that provider reports it; may differ from the work
            address.
        emailVerified:
          type: boolean
        lastUsedAt:
          format: date-time
          type: string
          nullable: true
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - provider
        - email
        - emailVerified
        - lastUsedAt
        - createdAt
    IdentityListDto:
