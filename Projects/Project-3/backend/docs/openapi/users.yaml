    BurnDownPointDto:
      type: object
      properties:
        date:
          type: string
          example: '2026-03-05'
        used:
          type: number
          description: >-
            Files uploaded this period so far, cumulative, at the end of that
            day.
        pace:
          type: number
          description: >-
            Where an even pace would be: included files × days elapsed ÷ days in
            the period.
      required:
        - date
        - used
        - pace
    QuotaBurnDownDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_2
