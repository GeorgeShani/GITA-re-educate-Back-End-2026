openapi: 3.0.0
paths:
  /users/me:
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
      security:
        - bearer: []
      tags:
        - users
      summary: Update your own profile
      description: >-
        Changes the signed-in person's own `fullName` — the personal-data half
        of "change password and personal data". Available to admins and
        employees.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_0
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    AcceptInviteDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the invitation email.
        password:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum: &ref_2
            - admin
            - employee
        status:
          type: string
          enum: &ref_3
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_0
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    GoogleUrlDto:
      type: object
      properties:
        intent:
          type: string
          enum:
            - login
            - register
            - invite
          description: >-
            `login` and `register` behave identically (a known Google account
            signs in, an unknown one is offered company registration); the value
            is for the frontend. `invite` binds the Google account to the
            invited user.
        inviteToken:
          type: string
          description: 'Required for `invite`: the token from the invitation email.'
      required:
        - intent
    OAuthUrlDto:
      type: object
      properties:
        url:
          type: string
          description: Send the browser here. Google sends it back to the API callback.
      required:
        - url
    OAuthExchangeDto:
      type: object
      properties:
        code:
          type: string
          description: >-
            The single-use `code` from the redirect to
            `/session/oauth-complete`. Valid for 60 seconds.
      required:
        - code
    OAuthRegistrationTokenDto:
      type: object
      properties:
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
      required:
        - oauthRegistrationToken
    OAuthRegistrationPreviewDto:
      type: object
      properties:
        email:
          type: string
          nullable: true
          description: >-
            The address to prefill, or null when Google reported a relay/alias
            address (ask the person for one).
        emailVerified:
          type: boolean
          description: >-
            True when Google vouches for `email`; registration then needs no
            activation email.
        name:
          type: string
          nullable: true
      required:
        - email
        - emailVerified
        - name
    OAuthRegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_0
        oauthRegistrationToken:
          type: string
          description: The `oauthRegistration` token from the redirect to `/register`.
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - companyName
        - country
        - industry
        - oauthRegistrationToken
    OAuthRegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          enum:
            - pending_activation
            - active
        message:
          type: string
        session:
          nullable: true
          description: >-
            Present when Google vouched for the address, so the company is
            active at once and the person is signed in.
          type: object
          allOf:
            - $ref: '#/components/schemas/SessionDto'
      required:
        - companyId
        - userId
        - status
        - message
    IdentityDto:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
          enum:
            - password
            - google
        email:
          type: string
          nullable: true
          description: >-
            The address as that provider reports it; may differ from the work
            address.
        emailVerified:
          type: boolean
        lastUsedAt:
          format: date-time
          type: string
          nullable: true
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - provider
        - email
        - emailVerified
        - lastUsedAt
        - createdAt
    IdentityListDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/IdentityDto'
      required:
        - data
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - fullName
    MemberDto:
      type: object
      properties:
        id:
          type: string
        fullName:
          type: string
      required:
        - id
        - fullName
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_0
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
    PlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: &ref_1
            - free
            - basic
            - premium
        maxEmployees:
          type: number
          nullable: true
          description: Employees allowed; null = unlimited.
        maxSeats:
          type: number
          nullable: true
          description: Seats = the admin plus employees; null = unlimited.
        filesPerPeriod:
          type: number
          description: Files per billing period before the over-quota rule applies.
        seatPriceCents:
          type: number
          description: Cents per employee per full period (prorated by active days).
        basePriceCents:
          type: number
          description: Flat cents per full period.
        overagePerFileCents:
          type: number
          nullable: true
          description: >-
            Cents per file over the quota; null = uploads over the quota are
            refused instead.
      required:
        - plan
        - maxEmployees
        - maxSeats
        - filesPerPeriod
        - seatPriceCents
        - basePriceCents
        - overagePerFileCents
    PeriodDto:
      type: object
      properties:
        start:
          type: string
          format: date-time
          description: Inclusive, UTC midnight.
        end:
          type: string
          format: date-time
          description: Exclusive, UTC midnight.
        key:
          type: string
          example: '2026-03-01'
          description: The period start date; the label usage is counted under.
        days:
          type: number
          example: 31
      required:
        - start
        - end
        - key
        - days
    LimitsDto:
      type: object
      properties:
        maxEmployees:
          type: number
          nullable: true
        maxSeats:
          type: number
          nullable: true
        filesPerPeriod:
          type: number
      required:
        - maxEmployees
        - maxSeats
        - filesPerPeriod
    UsageDto:
      type: object
      properties:
        files:
          type: number
          description: Files uploaded in the current period.
        employees:
          type: number
          description: Employees holding a seat — invited and active.
        seats:
          type: number
          description: 'Seats in use: the admin plus those employees.'
      required:
        - files
        - employees
        - seats
    SubscriptionDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_1
        billingAnchorDay:
          type: number
          minimum: 1
          maximum: 31
          description: Day of the month the period rolls over on.
        period:
          $ref: '#/components/schemas/PeriodDto'
        limits:
          $ref: '#/components/schemas/LimitsDto'
        usage:
          $ref: '#/components/schemas/UsageDto'
        nextDueDate:
          type: string
          format: date-time
          description: When the current period ends and is invoiced.
      required:
        - plan
        - billingAnchorDay
        - period
        - limits
        - usage
        - nextDueDate
    ChoosePlanDto:
      type: object
      properties:
        plan:
          type: string
          enum: *ref_1
      required:
        - plan
    PlanChangeResultDto:
      type: object
      properties:
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        previousPlan:
          type: string
          enum: *ref_1
        prorationCents:
          type: number
          description: >-
            Total cents of the invoice that closed the outgoing plan (0 if
            nothing was owed yet).
      required:
        - subscription
        - previousPlan
        - prorationCents
    InviteEmployeeDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
          description: Where the invitation is sent. Also the address they sign in with.
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - email
        - fullName
    EmployeeDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invitations go to.
        fullName:
          type: string
        role:
          type: string
          enum: *ref_2
        status:
          type: string
          enum: *ref_3
        activatedAt:
          type: string
          format: date-time
          nullable: true
        disabledAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
        - disabledAt
        - createdAt
    OffsetMetaDto:
      type: object
      properties:
        page:
          type: number
          example: 1
        limit:
          type: number
          example: 20
        total:
          type: number
          description: Rows matching the filter across all pages.
        totalPages:
          type: number
      required:
        - page
        - limit
        - total
        - totalPages
    EmployeePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmployeeDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
