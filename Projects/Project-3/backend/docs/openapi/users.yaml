        - createdByUserId
        - createdAt
        - updatedAt
    QualityRulePageDto:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QualityRuleDto'
        meta:
          $ref: '#/components/schemas/OffsetMetaDto'
      required:
        - data
        - meta
    CreateQualityRuleDto:
      type: object
      properties:
        name:
          type: string
          example: Emails are filled in
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: *ref_6
          description: >-
            `required_column` the column must exist; `max_null_percent` at most
            that share empty; `type_is` the column is that type; `min_value` /
            `max_value` numeric bounds; `unique` no value repeats;
            `max_duplicate_rows` (whole file, no column) at most that many
            repeated rows.
        columnName:
          type: string
          example: email
          description: >-
            The column it applies to, matched to a file’s header
            case-insensitively. Required for every kind but
            `max_duplicate_rows`, which takes none. A file without that column
            skips the rule (use `required_column` to demand one).
        params:
          type: object
          additionalProperties: true
          description: >-
            The rule’s numbers, by `kind`: `max_null_percent` `{ max: 0–100 }`;
            `type_is` `{ type: integer | number | boolean | date | string,
            maxInconsistentPercent?: 0–100 (default 0) }`; `min_value` `{ min
            }`; `max_value` `{ max }`; `max_duplicate_rows` `{ max }`.
            `required_column` and `unique` take `{}`.
        severity:
          type: string
          enum: *ref_7
          default: error
          description: >-
            An `error` counts double in the quality score, and a failing one
            notifies the uploader and the admins.
        enabled:
          type: boolean
          default: true
          description: >-
            A disabled rule is kept, and counts toward the plan’s limit, but is
            not checked.
      required:
        - name
        - kind
    UpdateQualityRuleDto:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        columnName:
          type: string
          maxLength: 200
          description: Only for a rule that is about a column.
        params:
          type: object
          additionalProperties: true
          description: >-
            REPLACES the rule’s numbers. The rule’s numbers, by `kind`:
            `max_null_percent` `{ max: 0–100 }`; `type_is` `{ type: integer |
            number | boolean | date | string, maxInconsistentPercent?: 0–100
            (default 0) }`; `min_value` `{ min }`; `max_value` `{ max }`;
            `max_duplicate_rows` `{ max }`. `required_column` and `unique` take
            `{}`.
        severity:
          type: string
          enum: *ref_7
        enabled:
          type: boolean
    DayRangeDto:
