openapi: 3.0.0
paths:
  /users/me:
    patch:
      operationId: UsersController_updateMe
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileDto'
      security:
        - bearer: []
      tags:
        - users
      summary: Update your own profile
      description: >-
        Changes the signed-in person's own `fullName` — the personal-data half
        of "change password and personal data". Available to admins and
        employees.
info:
  title: Gridline API
  description: >-
    Multi-tenant SaaS backend for spreadsheet upload, per-file permissions, and
    seat + usage billing.
  version: 0.1.0
  contact: {}
tags: []
servers:
  - url: /api
  - url: http://localhost:4000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    RegisterCompanyDto:
      type: object
      properties:
        companyName:
          type: string
          example: Acme Logistics
          minLength: 2
          maxLength: 120
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: &ref_0
            - finance
            - e-commerce
            - healthcare
            - education
            - logistics
            - manufacturing
            - media
            - real-estate
            - technology
            - other
      required:
        - companyName
        - email
        - password
        - country
        - industry
    RegisterCompanyResponseDto:
      type: object
      properties:
        companyId:
          type: string
        userId:
          type: string
        status:
          type: string
          example: pending_activation
        message:
          type: string
          example: Check your inbox to activate your account.
      required:
        - companyId
        - userId
        - status
        - message
    MessageResponseDto:
      type: object
      properties:
        message:
          type: string
          example: If that account exists, an email is on its way.
      required:
        - message
    EmailOnlyDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
      required:
        - email
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: nino@acme.com
          maxLength: 254
        password:
          type: string
          maxLength: 128
      required:
        - email
        - password
    SessionDto:
      type: object
      properties:
        accessToken:
          type: string
          description: 'Short-lived JWT. Send as `Authorization: Bearer`.'
        refreshToken:
          type: string
          description: Opaque, single-use. Rotated on every refresh.
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: number
          description: Seconds until the access token expires.
          example: 900
      required:
        - accessToken
        - refreshToken
        - tokenType
        - expiresIn
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: The single-use token from the reset email.
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - token
        - newPassword
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          maxLength: 128
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
      required:
        - currentPassword
        - newPassword
    UserProfileDto:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
          description: The company contact address invites are sent to.
        fullName:
          type: string
        role:
          type: string
          enum:
            - admin
            - employee
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - status
        - activatedAt
    CompanyDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        billingEmail:
          type: string
          description: Where invoices and account notices go.
        country:
          type: string
          example: GE
        industry:
          type: string
          enum: *ref_0
        status:
          type: string
          enum:
            - pending_activation
            - active
            - suspended
        activatedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - name
        - billingEmail
        - country
        - industry
        - status
        - activatedAt
    MeDto:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/UserProfileDto'
        company:
          $ref: '#/components/schemas/CompanyDto'
      required:
        - user
        - company
    UpdateMeDto:
      type: object
      properties:
        fullName:
          type: string
          example: Nino Beridze
          minLength: 1
          maxLength: 120
      required:
        - fullName
    UpdateCompanyDto:
      type: object
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        country:
          type: string
          example: GE
          description: ISO 3166-1 alpha-2 country code
        industry:
          type: string
          enum: *ref_0
        billingEmail:
          type: string
          example: nino@acme.com
          maxLength: 254
