paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Throttled to 5 requests per minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterDto'
      responses:
        '201':
          description: Access token for the newly created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: A user with this email already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
              example:
                message: User with email ada.lovelace@example.com already exists
                error: Conflict
                statusCode: 409
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpError'
              example:
                message: Invalid email or password
                error: Unauthorized
                statusCode: 401

  /auth/current-user:
    get:
      tags: [Auth]
      summary: Get the authenticated user
      security:
        - bearer: []
      responses:
        '200':
          description: The user the bearer token belongs to
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
